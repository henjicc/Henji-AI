[package]
name = "henji-video-decoder"
version = "0.1.0"
edition = "2021"
description = "Henji-AI 原生视频解码服务：长期驻留子进程，FFmpeg（GPL 共享库，重要记录 014）解码，D3D11 纹理输出"
publish = false
# 源码按项目 Apache-2.0 发布；可执行文件动态链接 GPL FFmpeg，整体按 GPL-3.0-or-later 分发（重要记录 014、任务 3.3）。
license = "GPL-3.0-or-later"

[[bin]]
name = "henji-video-decoder"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 绑定版本与 FFmpeg 主版本绑定：9.0.x 对应 FFmpeg 9.0（scripts/video-decoder-ffmpeg.cjs 固定的 BtbN 构建，重要记录 014）。
# 只链接解码需要的库；不启用 avdevice/avfilter（CLI 自带依赖，服务不链接）。
ffmpeg-sys-next = { version = "=9.0.0", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
debug = "line-tables-only"
