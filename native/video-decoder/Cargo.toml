[package]
name = "henji-video-decoder"
version = "0.1.0"
edition = "2021"
description = "Henji-AI 原生视频解码服务：长期驻留子进程，FFmpeg（LGPL 共享库）解码，D3D11 纹理输出"
publish = false

[[bin]]
name = "henji-video-decoder"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 绑定版本与 FFmpeg 主版本绑定：8.1.x 对应 FFmpeg 8.1（scripts/video-decoder-ffmpeg.cjs 固定的 BtbN 构建）。
# 只链接解码需要的库；不启用 postproc（GPL）与 avdevice/avfilter。
ffmpeg-sys-next = { version = "=8.1.0", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
] }

[profile.release]
debug = "line-tables-only"
