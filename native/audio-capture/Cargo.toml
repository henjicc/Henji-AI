[package]
name = "henji-audio-capture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-queue = "0.3"

[target.'cfg(windows)'.dependencies]
# 系统声回环（WASAPI loopback）直接用微软官方绑定，与视频解码服务同一版本。
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
