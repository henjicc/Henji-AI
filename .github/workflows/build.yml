name: Build Henji-AI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支/标签的重复推送只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 质量门禁：每次 push / PR 都跑。速度快、无需签名凭据。
  # 这是 UI 规范（check:colors / check:surface）与类型、测试的统一入口。
  # ---------------------------------------------------------------------------
  checks:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # better-sqlite3 / sharp 在 Linux 上装原生模块会拖慢且本步骤不需要它们，
      # 但 npm ci 仍需完整依赖树来解析 TS 类型，故正常安装。
      - name: 安装依赖
        run: npm ci

      # manifest 与 seeds 是自动生成产物（Git 忽略），检查前必须先生成，
      # 否则 check:model-i18n 与类型检查会因缺文件失败。
      - name: 生成 manifest 与 seeds
        run: |
          npm run gen:progress-seeds
          npm run gen:model-manifest

      - name: 颜色令牌检查
        run: npm run check:colors

      - name: 表面层级检查
        run: npm run check:surface:strict

      - name: 模型 i18n 检查
        run: npm run check:model-i18n

      - name: ESLint（渲染层）
        run: npm run lint

      - name: 智能助手应用能力门禁
        run: npm run check:assistant-capabilities

      - name: ESLint（主进程）
        run: npx eslint electron --ext ts --report-unused-disable-directives --max-warnings 0

      - name: 类型检查（渲染层）
        run: npx tsc -p tsconfig.json --noEmit

      - name: 类型检查（主进程）
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: 单元测试
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # 安装包构建：只在推 v* 标签或手动触发时运行。
  #
  # 平台矩阵按「构建机架构与目标架构一致」拆分：better-sqlite3 需要编译、
  # sharp 依赖按宿主架构安装的 @img/sharp-* 可选包，跨架构交叉编译容易失败，
  # 因此 macOS x64 用 x64 runner、arm64 用 arm64 runner，各自只出自己那一份。
  #
  # max-parallel: 1 —— electron-builder 会把产物发布到同一个 GitHub Release，
  # 并发发布会互相抢占（重复创建 / 覆盖 latest.yml），串行最稳。
  # ---------------------------------------------------------------------------
  build:
    name: 构建 ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-x64
          - os: macos-13
            label: macOS x64
            artifact: macos-x64
          - os: macos-latest
            label: macOS arm64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 标签构建时以标签名为准对齐 package.json 版本，
      # 否则 electron-builder 产物名与 Release 标签会不一致。
      - name: 对齐版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "package.json 版本 $CURRENT → $VERSION"
            npm version "$VERSION" --no-git-tag-version
          else
            echo "package.json 已是 $VERSION，跳过"
          fi

      - name: 安装依赖
        run: npm ci

      # electron:build 内部已串联 gen:seeds / gen:manifest / check:* / tsc / electron-vite build
      - name: 构建应用
        run: npm run electron:build

      # 未配置代码签名证书：显式关闭 macOS 自动签名发现，避免因找不到证书而失败。
      # 产物为未签名状态，这是当前已知的发布限制。
      - name: 打包并发布安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # electron-builder 自己发布：会同时上传 latest.yml / latest-mac.yml，
            # 这是 electron-updater 自动更新能正常工作的前提，不能改用只传安装包的方式。
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
