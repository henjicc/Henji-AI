name: Build Henji-AI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一事件下的重复运行只保留最新一次；普通推送不能取消手动安装包构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 质量门禁：每次 push / PR 都跑。速度快、无需签名凭据。
  # 这是 UI 规范（check:colors / check:surface）与类型、测试的统一入口。
  # ---------------------------------------------------------------------------
  checks:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # better-sqlite3 / sharp 在 Linux 上装原生模块会拖慢且本步骤不需要它们，
      # 但 npm ci 仍需完整依赖树来解析 TS 类型，故正常安装。
      - name: 安装依赖
        run: npm ci

      # progress seeds 是自动生成产物（Git 忽略），检查前必须先生成。
      - name: 生成 progress seeds
        run: npm run gen:progress-seeds

      - name: 颜色令牌检查
        run: npm run check:colors

      - name: 表面层级检查
        run: npm run check:surface:strict

      - name: 模型 i18n 检查
        run: npm run check:model-i18n

      - name: 模型适配 skill 同步检查
        run: npm run check:model-adaptation-skill-sync

      - name: ESLint（渲染层）
        run: npm run lint

      # 这里只跑结构门禁；其中的 Vitest 用例由后面的全量单测覆盖，避免重复执行 153 项。
      - name: 智能助手应用能力结构门禁
        run: npm run check:assistant-capabilities:structure

      - name: ESLint（主进程）
        run: npm run lint:electron

      - name: 类型检查（渲染层）
        run: npx tsc -p tsconfig.json --noEmit

      - name: 类型检查（主进程）
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: 测试分层完整性检查
        run: npm run test:suites

      - name: 普通单元测试（不依赖真实 GPU）
        run: npm run test:unit -- --maxWorkers=2 --minWorkers=1

      - name: 验证工具自检
        run: npm run test:validation-tools

  gpu-tests:
    name: WebGPU 像素正确性
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # 0.3.1 官方 adapter 支持的显式软件设备；仍执行正式 WGSL，不是 CPU 业务回退。
      VGPU_ADAPTER: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: 安装带 SHA-256 校验的官方软件 Vulkan 渲染器
        run: npx --no-install vgpu install-software-renderer
      - name: 验证设备与真实帧渲染（不可降级或跳过）
        run: npx --no-install vgpu doctor --pretty
      - name: 顺序执行 WebGPU 像素与 HDR probe
        run: npm run test:gpu

  image-export-tests:
    name: 大图导出正确性
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: 独占 worker 执行真实尺寸图层与内存预算验收
        run: npm run test:image-export

  native-tests:
    name: Electron 原生 SQLite 正确性
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: 安装原生编译工具与 Electron 动态库（Node 模式不启动桌面）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++ libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - run: npm ci
      # 此 job 独占 node_modules；不能把 Electron ABI 驱动带回普通 Node/GPU job。
      - name: 按当前锁定 Electron 重建 SQLite
        run: npm run electron:rebuild
      - name: 原生验收器的报告与进程生命周期自检
        run: node --test scripts/lib/nativePersistenceRunner.test.cjs
      - name: 完整原生 SQLite 清单（禁止零用例、跳过或漏文件）
        run: npm run test:assistant-persistence

  quality-gate:
    name: 质量门禁
    if: always()
    needs: [checks, gpu-tests, image-export-tests, native-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 所有必跑检查成功才允许交付
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          GPU_RESULT: ${{ needs.gpu-tests.result }}
          IMAGE_EXPORT_RESULT: ${{ needs.image-export-tests.result }}
          NATIVE_RESULT: ${{ needs.native-tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$GPU_RESULT" = success
          test "$IMAGE_EXPORT_RESULT" = success
          test "$NATIVE_RESULT" = success

  # ---------------------------------------------------------------------------
  # 安装包构建：只在推 v* 标签或手动触发时运行。
  #
  # 平台矩阵按「构建机架构与目标架构一致」拆分：better-sqlite3 需要编译、
  # sharp 依赖按宿主架构安装的 @img/sharp-* 可选包，跨架构交叉编译容易失败，
  # 因此 macOS x64 用 Intel runner、arm64 用 Apple Silicon runner，
  # 并把 matrix.arch 显式传给 electron-builder，各自只出自己那一份。
  #
  # max-parallel: 1 —— electron-builder 会把产物发布到同一个 GitHub Release，
  # 并发发布会互相抢占（重复创建 / 覆盖 latest.yml），串行最稳。
  # ---------------------------------------------------------------------------
  build:
    name: 构建 ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: quality-gate
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-x64
            arch: x64
          - os: macos-15-intel
            label: macOS x64
            artifact: macos-x64
            arch: x64
          - os: macos-latest
            label: macOS arm64
            artifact: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 标签构建时以标签名为准对齐 package.json 版本，
      # 否则 electron-builder 产物名与 Release 标签会不一致。
      - name: 对齐版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "package.json 版本 $CURRENT → $VERSION"
            npm version "$VERSION" --no-git-tag-version
          else
            echo "package.json 已是 $VERSION，跳过"
          fi

      - name: 安装依赖
        run: npm ci

      # electron:build 内部已串联 gen:seeds / gen:manifest / check:* / tsc / electron-vite build
      - name: 构建应用
        run: npm run electron:build

      # 未配置代码签名证书：显式关闭 macOS 自动签名发现，避免因找不到证书而失败。
      # 产物为未签名状态，这是当前已知的发布限制。
      - name: 打包并发布安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # electron-builder 自己发布：会同时上传 latest.yml / latest-mac.yml，
            # 这是 electron-updater 自动更新能正常工作的前提，不能改用只传安装包的方式。
            npx electron-builder --${{ matrix.arch }} --publish always
          else
            npx electron-builder --${{ matrix.arch }} --publish never
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.msi
            release/*.dmg
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
