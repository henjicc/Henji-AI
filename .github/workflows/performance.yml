name: 显式性能专项
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --force
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run gen:progress-seeds
      - run: npm run test:performance -- --silent
