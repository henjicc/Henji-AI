<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页拆层验收页</title>
<!-- 渐变底、玻璃卡片上的中英混排文字，带发光。背景不是纯色：字移开后露出的必须是干净背景，不是原字。 -->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  [data-henji-stage] { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(120deg, #1b2a6b, #7a2a8c 55%, #e0653a); }
  #card { position: absolute; left: 180px; top: 150px; width: 1560px; height: 780px; border-radius: 40px; background: rgba(255, 255, 255, .14); }
  #title { position: absolute; left: 260px; top: 230px; width: 1400px; font-size: 128px; font-weight: 700; color: #fff; text-shadow: 0 0 22px rgba(120, 220, 255, .9); }
  #body { position: absolute; left: 264px; top: 520px; width: 1380px; font-size: 56px; line-height: 1.5; color: #ffe9a8; }
  #body em { font-style: normal; color: #8cf5c4; }
</style>
</head>
<body>
<div data-henji-stage>
  <div id="card"></div>
  <div id="title">逐字特效 Per-Glyph</div>
  <div id="body">网页排好的中英混排 mixed text，换行也由<em>浏览器</em>决定，每个字都能单独操作。</div>
</div>
<script>
  window.henjiWeb = { ready: document.fonts.ready, duration: 10, async seek() {} }
</script>
</body>
</html>
