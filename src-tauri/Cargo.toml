[package]
name = "henji-ai"
version = "0.1.1"
description = "一个聚合多家AI供应商，一站式生成图片、视频和音频的客户端"
authors = ["henjicc"]
license = "Apache-2.0"
repository = "https://github.com/henjicc/Henji-AI"
edition = "2021"
rust-version = "1.70"

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset", "devtools", "image-png"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-http = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "multipart"] }
genai = "0.6.2"
futures = "0.3"
once_cell = "1.20"
keyring = "2.3"
tokio = { version = "1.43", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

base64 = "0.21"
hmac = "0.12"
sha1 = "0.10"
httpdate = "1.0"
boa_engine = "0.20"
image = { version = "0.25", features = ["jpeg", "png"] }
ab_glyph = "0.2"
imageproc = "0.25"
md5 = "0.7"
png = "0.17"
urlencoding = "2"
tauri-plugin-drag = "2.1.0"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

# 在开发模式下为图片处理和剪贴板相关 crate 开启优化
# 解决复制图片时延迟的问题（Debug 模式这些库非常慢）
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-inflate]
opt-level = 3

# 剪贴板库优化
[profile.dev.package.arboard]
opt-level = 3

# 其他图片处理相关
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
