<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB4FF}a:hover{color:#B3CCFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: Geist, 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; font-size: 13px; background: var(--window); color: var(--text1); {{themeVars}}">
<dc-import name="TitleBar" active="generate" hint-size="100%,40px"></dc-import>

<main style="flex: 1; min-height: 0; position: relative; display: flex; justify-content: center; overflow: hidden">
<div style="width: 100%; max-width: 880px; box-sizing: border-box; padding: 16px 24px 0; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div role="tablist" aria-label="筛选类型" style="display: flex; gap: 2px">
<button type="button" role="tab" aria-selected="true" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--hover); color: var(--text1); font: inherit; font-size: 12px; font-weight: 500">全部</button>
<button type="button" role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; font-weight: 500">图片</button>
<button type="button" role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; font-weight: 500">视频</button>
<button type="button" role="tab" aria-selected="false" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; font-weight: 500">音频</button>
</div>
<div style="display: flex; gap: 2px">
<dc-import name="IconButton" glyph="search" label="搜索历史" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="more" label="更多：清除历史等" hint-size="28px,28px"></dc-import>
</div>
</div>

<article style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 16px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">雨后的江南小镇，石板路倒映着灯笼，电影感，35mm 胶片颗粒</p>
<div style="font-size: 12px; color: var(--text3)">图片 · Z-Image Turbo · 4 张 · 今天 06:29</div>
</div>
<div style="display: flex; gap: 2px; flex: none">
<dc-import name="IconButton" glyph="refresh" label="再次生成" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="pencil" label="编辑提示词" state="hover" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="download" label="下载全部" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="more" label="更多操作" hint-size="28px,28px"></dc-import>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{images}}" as="img" hint-placeholder-count="4">
<div role="img" aria-label="{{img.label}}" style="aspect-ratio: 1 / 1; border-radius: 8px; {{img.st}}"></div>
</sc-for>
</div>
</article>

<article style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">纸灯笼在雨中轻轻摇晃，镜头缓慢推进</p>
<div style="font-size: 12px; color: var(--text3)">视频 · Hailuo 2.3 · 768P · 6 秒 · 今天 06:12</div>
</div>
<div style="position: relative; width: 384px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden">
<dc-import name="Filmstrip" frames="1" seed="12" height="216" hint-size="384px,216px"></dc-import>
<div style="position: absolute; left: 50%; top: 50%; margin: -18px 0 0 -18px"><dc-import name="IconButton" glyph="play" label="播放视频" tone="media" size="lg" solid="{{true}}" hint-size="32px,32px"></dc-import></div>
<span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px; background: rgba(10, 11, 13, 0.6); font-size: 11px; font-family: 'Geist Mono', monospace; color: #FFFFFF">0:06</span>
</div>
</article>

<article style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; line-height: 22px">“欢迎回到痕迹的频道，今天我们聊聊本地剪辑。”</p>
<div style="font-size: 12px; color: var(--text3)">音频 · MiniMax Speech 2.8 · 温和男声 · 今天 05:58</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; width: 520px; height: 36px">
<dc-import name="IconButton" glyph="play" label="播放音频" solid="{{true}}" hint-size="28px,28px"></dc-import>
<div style="flex: 1; min-width: 0"><dc-import name="Waveform" mode="mini" bins="140" seed="19" played="0.4" height="28" label="生成的配音波形" hint-size="100%,28px"></dc-import></div>
<span style="flex: none; font-size: 12px; font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; color: var(--text2)">0:12 / 0:30</span>
</div>
</article>

<article style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-start; gap: 16px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; line-height: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">以参考图为首帧，镜头缓慢推进，雨滴落在灯笼上</p>
<div style="font-size: 12px; color: var(--text3)">视频 · Kling 3.0 · 1080P · 5 秒 · 生成中 42%</div>
</div>
<dc-import name="Button" variant="quiet" size="sm" label="取消" hint-size="48px,28px"></dc-import>
</div>
<div style="height: 2px; border-radius: 1px; background: var(--line); overflow: hidden"><div style="width: 42%; height: 2px; background: var(--text2)"></div></div>
</article>
</div>

<section aria-label="生成输入" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: calc(100% - 48px); max-width: 880px; box-sizing: border-box; background: var(--panel); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 18px 48px var(--shade); padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 8px; padding: 2px 4px 0">
<div style="position: relative; width: 48px; height: 48px; border-radius: 8px; overflow: hidden"><dc-import name="Filmstrip" frames="1" seed="12" height="48" hint-size="48px,48px"></dc-import>
<div style="position: absolute; right: 2px; top: 2px"><dc-import name="IconButton" glyph="x" label="移除参考图" size="xs" tone="media" hint-size="20px,20px"></dc-import></div>
</div>
</div>
<label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">提示词</span>
<textarea rows="2" style="width: 100%; box-sizing: border-box; resize: none; background: transparent; border: 0; outline: none; color: var(--text1); font: inherit; font-size: 14px; line-height: 22px; padding: 4px 6px">以参考图为首帧，镜头缓慢推进，雨滴落在灯笼上</textarea></label>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 2px">
<dc-import name="IconButton" glyph="plus" label="添加参考素材" size="lg" hint-size="32px,32px"></dc-import>
<dc-import name="Button" variant="quiet" label="Hailuo 2.3" trailing="chevDown" hint-size="110px,32px"></dc-import>
<dc-import name="Button" variant="quiet" label="768P · 6 秒" trailing="chevDown" hint-size="104px,32px"></dc-import>
<dc-import name="Button" variant="quiet" state="pressed" label="扩写" glyph="sparkles" hint-size="72px,32px"></dc-import>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<span style="font-size: 12px; color: var(--text3); padding: 0 6px; font-variant-numeric: tabular-nums">约 ¥2.00</span>
<dc-import name="Button" variant="quiet" label="优化" glyph="wand" hint-size="72px,32px"></dc-import>
<dc-import name="IconButton" glyph="arrowUp" label="生成" tone="accent" size="lg" hint-size="32px,32px"></dc-import>
</div>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","default":"graphite","options":["graphite","ocean","film","paper"],"section":"主题"},"accent":{"editor":"enum","default":"跟随预设","options":["跟随预设","蓝","紫","青","橙","玫红"],"section":"主题"},"$preview":{"width":1440,"height":900}}'>
const HenjiTheme = (function () {
  const toLin = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const toSrgb = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  function rgbOf(L, C, H) {
    let c = C;
    for (let n = 0; n < 60; n++) {
      const h = (H * Math.PI) / 180; const a = c * Math.cos(h); const b = c * Math.sin(h);
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      const s_ = L - 0.0894841775 * a - 1.291485548 * b;
      const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s].map(toSrgb);
      if (rgb.every(v => v >= -0.002 && v <= 1.002) || c <= 0) return rgb.map(v => Math.min(1, Math.max(0, v)));
      c = Math.max(0, c - 0.005);
    }
    return [L, L, L];
  }
  const hex = rgb => '#' + rgb.map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('').toUpperCase();
  const ok = (L, C, H) => hex(rgbOf(Math.min(1, Math.max(0, L)), Math.max(0, C), H));
  const parse = x => { const n = parseInt(String(x).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  function toOklch(x) {
    const [r, g, b] = parse(x).map(v => toLin(v / 255));
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
    const B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    return { L: 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, C: Math.hypot(A, B), H: ((Math.atan2(B, A) * 180) / Math.PI + 360) % 360 };
  }
  const lum = x => { const [r, g, b] = parse(x).map(v => toLin(v / 255)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const alpha = (x, a) => { const [r, g, b] = parse(x); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
  const PRESETS = {
    graphite: { name: '石墨', mode: 'dark', hue: 260, tint: 0.006, base: 0.17, accent: '#3A6FDF' },
    ocean: { name: '深海', mode: 'dark', hue: 245, tint: 0.024, base: 0.165, accent: '#3D86E8' },
    film: { name: '胶片', mode: 'dark', hue: 70, tint: 0.013, base: 0.172, accent: '#D9822B' },
    paper: { name: '纸白', mode: 'light', hue: 260, tint: 0.005, base: 0.975, accent: '#3A6FDF' }
  };
  const ACCENTS = { '跟随预设': null, '蓝': '#3A6FDF', '紫': '#7B61FF', '青': '#159F8C', '橙': '#D9822B', '玫红': '#D9467A' };
  function derive(seed) {
    const s = Object.assign({ contrast: 1 }, seed);
    const dark = s.mode !== 'light';
    const k = s.contrast; const st = 0.024 * k; const L0 = s.base;
    const N = (L, c) => ok(L, c === undefined ? s.tint : c, s.hue);
    const t = {};
    if (dark) {
      Object.assign(t, { gap: N(L0 - 0.6 * st), window: N(L0), panel: N(L0 + st), raised: N(L0 + 2 * st), control: N(L0 + 2.8 * st), controlHover: N(L0 + 3.8 * st), controlPressed: N(L0 + 4.8 * st), hover: N(L0 + 2.6 * st), selected: N(L0 + 4 * st), line: N(L0 + 2.2 * st), lineStrong: N(L0 + 3.8 * st), text1: N(0.95, s.tint * 0.5), text2: N(0.95 - 0.18 * k, s.tint * 0.8), text3: N(0.95 - 0.32 * k, s.tint), textDisabled: N(L0 + 0.2), edge: 'rgba(255,255,255,0.06)', shade: 'rgba(0,0,0,0.5)', media: N(L0 - 0.5 * st) });
    } else {
      Object.assign(t, { gap: N(L0 - 0.05 * k), window: N(L0), panel: N(Math.min(1, L0 + 0.022)), raised: N(L0 - 0.022 * k), control: N(L0 - 0.032 * k), controlHover: N(L0 - 0.055 * k), controlPressed: N(L0 - 0.08 * k), hover: N(L0 - 0.035 * k), selected: N(L0 - 0.065 * k), line: N(L0 - 0.075 * k), lineStrong: N(L0 - 0.13 * k), text1: N(0.2, s.tint * 2), text2: N(0.2 + 0.25 * k, s.tint * 2), text3: N(0.2 + 0.33 * k, s.tint * 2), textDisabled: N(0.78), edge: 'rgba(0,0,0,0.07)', shade: 'rgba(28,32,40,0.18)', media: N(0.16) });
    }
    const a = toOklch(s.accent);
    const aL = dark ? Math.min(0.64, Math.max(0.5, a.L)) : Math.min(0.6, Math.max(0.46, a.L));
    const A = (L, C) => ok(L, C === undefined ? a.C : C, a.H);
    Object.assign(t, { accent: A(aL), accentHi: A(aL + 0.035), accentHover: A(aL + 0.04), accentHoverHi: A(aL + 0.075), accentPressed: A(aL - 0.045), accentText: dark ? A(0.8, Math.min(a.C, 0.13)) : A(0.5), accentRing: A(dark ? 0.7 : 0.62) });
    t.accentTint = alpha(t.accent, dark ? 0.2 : 0.12);
    t.onAccent = contrast('#FFFFFF', t.accent) >= 4.5 ? '#FFFFFF' : N(0.17, 0.01);
    Object.assign(t, { danger: ok(dark ? 0.6 : 0.55, 0.19, 25), dangerHi: ok(dark ? 0.635 : 0.585, 0.19, 25), dangerText: ok(dark ? 0.74 : 0.5, 0.15, 25), success: ok(dark ? 0.76 : 0.55, 0.15, 155), warning: ok(dark ? 0.8 : 0.64, 0.15, 75) });
    t.dangerTint = alpha(t.danger, dark ? 0.16 : 0.1);
    const clipL = dark ? L0 + 6 * st : L0 - 0.12; const edgeL = clipL + (dark ? 0.07 : -0.09);
    Object.assign(t, { clipVideo: ok(clipL, 0.045, 255), clipVideoLine: ok(edgeL, 0.07, 255), clipAudio: ok(clipL, 0.045, 165), clipAudioLine: ok(edgeL, 0.07, 165), clipText: ok(clipL, 0.045, 305), clipTextLine: ok(edgeL, 0.07, 305), clipWave: dark ? ok(0.84, 0.06, 165) : ok(0.36, 0.07, 165), wave: N(0.6), wavePlayed: t.text1, waveCut: ok(dark ? 0.42 : 0.78, 0.09, 25) });
    return t;
  }
  const vars = t => Object.keys(t).map(key => '--' + key.replace(/[A-Z]/g, m => '-' + m.toLowerCase()) + ': ' + t[key]).join('; ');
  function fromProps(props) {
    const base = PRESETS[props.preset || 'graphite'] || PRESETS.graphite;
    const accent = ACCENTS[props.accent || '跟随预设'];
    return vars(derive(Object.assign({}, base, accent ? { accent } : {})));
  }
  return { PRESETS, derive, vars, contrast, ok, fromProps };
})();
class Component extends DCLogic {
  renderVals() {
    return {
      themeVars: HenjiTheme.fromProps(this.props),
      images: [
        { label: '结果 1', st: 'background: radial-gradient(circle at 32% 58%, rgba(255,170,90,0.42), transparent 18%), radial-gradient(circle at 70% 40%, rgba(255,150,80,0.3), transparent 14%), linear-gradient(165deg, #2B3542 0%, #182027 58%, #352B25 100%)' },
        { label: '结果 2', st: 'background: radial-gradient(circle at 55% 50%, rgba(255,185,110,0.36), transparent 20%), linear-gradient(175deg, #232C36 0%, #141A1F 62%, #2C2420 100%)' },
        { label: '结果 3', st: 'background: radial-gradient(circle at 25% 35%, rgba(240,160,90,0.3), transparent 16%), radial-gradient(circle at 78% 68%, rgba(255,180,100,0.34), transparent 18%), linear-gradient(150deg, #28313B 0%, #161C21 100%)' },
        { label: '结果 4', st: 'background: radial-gradient(circle at 48% 62%, rgba(255,160,85,0.4), transparent 22%), linear-gradient(185deg, #2F3843 0%, #1A2026 55%, #3A2E27 100%)' }
      ]
    };
  }
}
</script>
</body>
</html>
