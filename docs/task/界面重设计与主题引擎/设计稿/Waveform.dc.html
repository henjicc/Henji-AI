<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>波形</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg role="img" aria-label="{{label}}" width="100%" height="{{height}}" viewBox="0 0 1000 100" preserveAspectRatio="none" style="display: block; width: 100%; height: {{height}}px; overflow: visible">
<path d="M0 50H1000" vector-effect="non-scaling-stroke" style="stroke: {{axisColor}}; stroke-width: 1; fill: none"></path>
<sc-for list="{{layers}}" as="layer" hint-placeholder-count="4">
<path d="{{layer.d}}" vector-effect="non-scaling-stroke" style="stroke-linecap: round; {{layer.st}}"></path>
</sc-for>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"standard","options":["mini","standard","detail"]},"tone":{"editor":"enum","default":"neutral","options":["neutral","clip"]},"bins":{"editor":"int","default":600,"min":40,"max":1600},"seed":{"editor":"int","default":7,"min":1,"max":999},"played":{"editor":"float","default":0.3,"min":0,"max":1,"step":0.01},"cuts":{"editor":"text","default":""},"height":{"editor":"int","default":96,"min":12,"max":400},"label":{"editor":"text","default":"音频波形"},"$preview":{"width":800,"height":120}}'>
const V = (name, fallback) => 'var(--' + name + ', ' + fallback + ')';
function rng(seed) {
  let a = (seed >>> 0) || 1;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function speech(bins, seed) {
  const r = rng(seed);
  const env = new Array(bins).fill(0);
  let x = 0;
  while (x < bins) {
    const pause = r() < 0.16;
    const len = Math.max(2, Math.round(bins * (pause ? 0.018 + r() * 0.035 : 0.007 + r() * 0.026)));
    const amp = pause ? 0.025 : 0.32 + r() * 0.68;
    for (let i = 0; i < len && x + i < bins; i++) {
      const p = (i + 0.5) / len;
      env[x + i] = Math.max(env[x + i], amp * Math.pow(Math.sin(Math.PI * p), 0.55));
    }
    x += len;
  }
  const peak = env.map(e => Math.min(1, e * (0.6 + 0.4 * r()) + 0.015 + 0.02 * r()));
  const rms = peak.map(p => p * (0.38 + 0.2 * r()));
  return { peak, rms };
}
function categories(bins, played, cuts) {
  const ranges = String(cuts || '').split(',').map(s => s.trim()).filter(Boolean).map(s => s.split('-').map(Number)).filter(p => p.length === 2 && p.every(n => !isNaN(n)));
  return Array.from({ length: bins }, (_, i) => {
    const t = (i + 0.5) / bins;
    if (ranges.some(([a, b]) => t >= a && t < b)) return 'cut';
    return t < played ? 'played' : 'rest';
  });
}
function area(values, cats, cat, scale) {
  const n = values.length; const w = 1000 / n; let d = '';
  let i = 0;
  while (i < n) {
    if (cats[i] !== cat) { i++; continue; }
    let j = i; while (j < n && cats[j] === cat) j++;
    let top = 'M' + (i * w).toFixed(1) + ' 50';
    let bottom = '';
    for (let k = i; k < j; k++) {
      const x = ((k + 0.5) * w).toFixed(1);
      const h = values[k] * scale;
      top += 'L' + x + ' ' + (50 - h).toFixed(1);
      bottom = 'L' + x + ' ' + (50 + h).toFixed(1) + bottom;
    }
    d += top + 'L' + (j * w).toFixed(1) + ' 50' + bottom + 'Z';
    i = j;
  }
  return d;
}
function detail(seed) {
  const r = rng(seed);
  const n = 220; const f1 = 3.1 + r() * 1.5; const f2 = 7.3 + r() * 2; const f3 = 13 + r() * 4; const ph = r() * 6.28;
  let curve = ''; let stems = '';
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const env = 0.55 + 0.45 * Math.sin(Math.PI * t);
    const v = env * (0.58 * Math.sin(2 * Math.PI * f1 * t) + 0.28 * Math.sin(2 * Math.PI * f2 * t + ph) + 0.12 * Math.sin(2 * Math.PI * f3 * t));
    const x = (t * 1000).toFixed(1); const y = (50 - v * 44).toFixed(1);
    curve += (i ? 'L' : 'M') + x + ' ' + y;
    if (i % 3 === 0) stems += 'M' + x + ' 50V' + y;
  }
  return { curve, stems };
}
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'standard';
    const tone = this.props.tone ?? 'neutral';
    const seed = this.props.seed ?? 7;
    const height = this.props.height ?? 96;
    const fill = (c, o) => 'fill:' + c + ';fill-opacity:' + o + ';stroke:none';
    if (mode === 'detail') {
      const { curve, stems } = detail(seed);
      return {
        height, label: this.props.label ?? '音频波形', axisColor: V('line-strong', '#3A3E45'),
        layers: [
          { d: stems, st: 'fill:none;stroke:' + V('wave', '#6E7684') + ';stroke-width:1;stroke-opacity:0.7' },
          { d: curve, st: 'fill:none;stroke:' + V('wave-played', '#ECEDEF') + ';stroke-width:1.5;stroke-linejoin:round' }
        ]
      };
    }
    const bins = mode === 'mini' ? Math.min(this.props.bins ?? 120, 240) : (this.props.bins ?? 600);
    const { peak, rms } = speech(bins, seed);
    const played = tone === 'clip' ? 0 : (this.props.played ?? 0.3);
    const cats = categories(bins, played, this.props.cuts);
    const scale = mode === 'mini' ? 48 : 46;
    const layers = [];
    const colors = tone === 'clip'
      ? { rest: V('clip-wave', '#9ED3C2'), played: V('clip-wave', '#9ED3C2'), cut: V('wave-cut', '#6B3538') }
      : { rest: V('wave', '#6E7684'), played: V('wave-played', '#ECEDEF'), cut: V('wave-cut', '#6B3538') };
    ['rest', 'played', 'cut'].forEach(cat => {
      if (!cats.includes(cat)) return;
      layers.push({ d: area(peak, cats, cat, scale), st: fill(colors[cat], tone === 'clip' ? 0.38 : 0.45) });
      if (mode !== 'mini') layers.push({ d: area(rms, cats, cat, scale), st: fill(colors[cat], tone === 'clip' ? 0.85 : 1) });
    });
    return { height, label: this.props.label ?? '音频波形', axisColor: tone === 'clip' ? 'transparent' : V('line', '#24272C'), layers };
  }
}
</script>
</body>
</html>
