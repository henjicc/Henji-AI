<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工具</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB4FF}a:hover{color:#B3CCFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: Geist, 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; font-size: 13px; background: var(--window); color: var(--text1); {{themeVars}}">
<dc-import name="TitleBar" active="tools" hint-size="100%,40px"></dc-import>

<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center">
<div style="width: 100%; max-width: 1040px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">工具</h1>
<p style="margin: 0; font-size: 13px; color: var(--text2)">不依赖生成和画布、可以单独打开的处理工具</p>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
<a href="#" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 12px; text-decoration: none; color: var(--text1); {{t.st}}">
<div style="width: 36px; height: 36px; border-radius: 9px; background: var(--raised); color: var(--text1); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 var(--edge)"><dc-import name="Icon" glyph="{{t.glyph}}" size="18" weight="1.6" hint-size="18px,18px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 500">{{t.name}}</span>
<span style="font-size: 12px; line-height: 18px; color: var(--text2)">{{t.desc}}</span>
</div>
<span style="font-size: 11px; color: var(--text3)">{{t.recent}}</span>
</a>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 14px; font-weight: 500">最近文件</h2>
<dc-import name="Button" variant="quiet" size="sm" label="全部" hint-size="48px,28px"></dc-import>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
<a href="#" style="display: grid; grid-template-columns: 28px minmax(0, 1fr) 140px 120px; align-items: center; gap: 12px; height: 44px; padding: 0 10px; margin: 0 -10px; border-radius: 8px; text-decoration: none; color: var(--text1); {{r.st}}">
<span style="color: var(--text3); display: flex"><dc-import name="Icon" glyph="{{r.glyph}}" size="16" hint-size="16px,16px"></dc-import></span>
<span style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.name}}</span>
<span style="font-size: 12px; color: var(--text2)">{{r.tool}}</span>
<span style="font-size: 12px; color: var(--text3); text-align: right">{{r.time}}</span>
</a>
</sc-for>
</div>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","default":"graphite","options":["graphite","ocean","film","paper"],"section":"主题"},"accent":{"editor":"enum","default":"跟随预设","options":["跟随预设","蓝","紫","青","橙","玫红"],"section":"主题"},"$preview":{"width":1440,"height":900}}'>
const HenjiTheme = (function () {
  const toLin = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const toSrgb = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);
  function rgbOf(L, C, H) {
    let c = C;
    for (let n = 0; n < 60; n++) {
      const h = (H * Math.PI) / 180; const a = c * Math.cos(h); const b = c * Math.sin(h);
      const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
      const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
      const s_ = L - 0.0894841775 * a - 1.291485548 * b;
      const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
      const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s].map(toSrgb);

    const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;

  }
  const lum = x => { const [r, g, b] = parse(x).map(v => toLin(v / 255)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const alpha = (x, a) => { const [r, g, b] = parse(x); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
  const PRESETS = {
    graphite: { name: '石墨', mode: 'dark', hue: 260, tint: 0.006, base: 0.17, accent: '#3A6FDF' },
    ocean: { name: '深海', mode: 'dark', hue: 245, tint: 0.024, base: 0.165, accent: '#3D86E8' },
    film: { name: '胶片', mode: 'dark', hue: 70, tint: 0.013, base: 0.172, accent: '#D9822B' },
    paper: { name: '纸白', mode: 'light', hue: 260, tint: 0.005, base: 0.975, accent: '#3A6FDF' }
  };
  const ACCENTS = { '跟随预设': null, '蓝': '#3A6FDF', '紫': '#7B61FF', '青': '#159F8C', '橙': '#D9822B', '玫红': '#D9467A' };

    } else {
      Object.assign(t, { gap: N(L0 - 0.05 * k), window: N(L0), panel: N(Math.min(1, L0 + 0.022)), raised: N(L0 - 0.022 * k), control: N(L0 - 0.032 * k), controlHover: N(L0 - 0.055 * k), controlPressed: N(L0 - 0.08 * k), hover: N(L0 - 0.035 * k), selected: N(L0 - 0.065 * k), line: N(L0 - 0.075 * k), lineStrong: N(L0 - 0.13 * k), text1: N(0.2, s.tint * 2), text2: N(0.2 + 0.25 * k, s.tint * 2), text3: N(0.2 + 0.33 * k, s.tint * 2), textDisabled: N(0.78), edge: 'rgba(0,0,0,0.07)', shade: 'rgba(28,32,40,0.18)', media: N(0.16) });
    }
    const a = toOklch(s.accent);
    const aL = dark ? Math.min(0.64, Math.max(0.5, a.L)) : Math.min(0.6, Math.max(0.46, a.L));
    const A = (L, C) => ok(L, C === undefined ? a.C : C, a.H);
    Object.assign(t, { accent: A(aL), accentHi: A(aL + 0.035), accentHover: A(aL + 0.04), accentHoverHi: A(aL + 0.075), accentPressed: A(aL - 0.045), accentText: dark ? A(0.8, Math.min(a.C, 0.13)) : A(0.5), accentRing: A(dark ? 0.7 : 0.62) });
    t.accentTint = alpha(t.accent, dark ? 0.2 : 0.12);

    Object.assign(t, { danger: ok(dark ? 0.6 : 0.55, 0.19, 25), dangerHi: ok(dark ? 0.635 : 0.585, 0.19, 25), dangerText: ok(dark ? 0.74 : 0.5, 0.15, 25), success: ok(dark ? 0.76 : 0.55, 0.15, 155), warning: ok(dark ? 0.8 : 0.64, 0.15, 75) });

  renderVals() {
    return {
      themeVars: HenjiTheme.fromProps(this.props),
      tools: [
        { name: '口播剪辑', desc: '按逐字稿剪口播：删掉停顿和语气词，保留想要的句子，导出成片或交给剪辑', recent: '最近：采访_0928.wav', glyph: 'mic', st: 'background: var(--panel); box-shadow: inset 0 0 0 1px var(--line-strong)' },
        { name: '图片编辑', desc: '打开或粘贴图片，标注、裁剪、模糊与调整，一键复制或保存', recent: '最近：封面_v3.png', glyph: 'image', st: 'background: var(--panel); box-shadow: none' },
        { name: '3D 镜头参考', desc: '搭三维场景、摆角色姿势、调机位取景，截图作为生成参考图', recent: '最近：雨巷夜景', glyph: 'cube', st: 'background: var(--panel); box-shadow: none' }
      ],
      recent: [
        { name: '采访_0928.wav', tool: '口播剪辑', time: '今天 10:42', glyph: 'mic', st: 'background: var(--hover)' },
        { name: '封面_v3.png', tool: '图片编辑', time: '今天 09:05', glyph: 'image', st: 'background: transparent' },
        { name: '雨巷夜景', tool: '3D 镜头参考', time: '昨天', glyph: 'cube', st: 'background: transparent' },
        { name: '产品口播_第二版.mp4', tool: '口播剪辑', time: '9 月 30 日', glyph: 'mic', st: 'background: transparent' },

  }
}
</script>
</body>
</html>
