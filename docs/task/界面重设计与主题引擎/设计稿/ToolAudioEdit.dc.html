<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>口播剪辑</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB4FF}a:hover{color:#B3CCFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: Geist, 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; font-size: 13px; background: var(--window); color: var(--text1); {{themeVars}}">
<dc-import name="TitleBar" active="tools" hint-size="100%,40px"></dc-import>

<div style="height: 44px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--gap)">
<dc-import name="IconButton" glyph="chevLeft" label="返回工具" hint-size="28px,28px"></dc-import>
<dc-import name="Button" variant="quiet" size="sm" label="采访_0928" trailing="chevDown" hint-size="96px,28px"></dc-import>
<span style="font-size: 12px; color: var(--text3)">已自动保存</span>
<div style="flex: 1; display: flex; justify-content: center">
<div role="radiogroup" aria-label="查看" style="display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--gap)">
<button type="button" role="radio" aria-checked="false" style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text2); font: inherit; font-size: 12px; font-weight: 500">原始</button>
<button type="button" role="radio" aria-checked="true" style="height: 26px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--selected); color: var(--text1); font: inherit; font-size: 12px; font-weight: 500; box-shadow: inset 0 1px 0 var(--edge)">剪后</button>
</div>
</div>
<dc-import name="IconButton" glyph="search" label="查找" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="undo" label="撤销" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="redo" label="重做" state="disabled" hint-size="28px,28px"></dc-import>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 4px"></span>
<dc-import name="Button" variant="secondary" label="加入剪辑" hint-size="84px,32px"></dc-import>
<dc-import name="Button" variant="primary" label="导出" glyph="download" hint-size="72px,32px"></dc-import>
</div>

<div style="flex: 1; min-height: 0; display: flex">
<main style="flex: 1; min-width: 0; overflow: hidden; display: flex; justify-content: center">
<div style="width: 100%; max-width: 760px; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
<sc-for list="{{paragraphs}}" as="para" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums">{{para.speaker}}</div>
<p style="margin: 0; font-size: 17px; line-height: 32px">
<sc-for list="{{para.tokens}}" as="t" hint-placeholder-count="10"><span style="display: inline; {{t.s}}">{{t.text}}</span></sc-for>
</p>
</div>
</sc-for>
</div>
</main>

<aside aria-label="处理" style="width: 300px; flex: none; box-sizing: border-box; background: var(--panel); border-left: 1px solid var(--gap); padding: 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 500">一键处理</h2>
<p style="margin: 0; font-size: 12px; line-height: 18px; color: var(--text2)">压缩停顿、删除语气词，处理后仍可逐词调整。</p>
<dc-import name="Button" variant="secondary" label="开始处理" glyph="sparkles" block="{{true}}" hint-size="100%,32px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 8px">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
<button type="button" aria-expanded="false" style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 8px; margin: 0 -8px; border: 0; border-radius: 6px; background: transparent; color: var(--text1); font: inherit; font-size: 13px; text-align: left">{{sec.name}}<span style="display: flex; align-items: center; gap: 6px; color: var(--text3); font-size: 12px">{{sec.value}}<dc-import name="Icon" glyph="chevRight" size="14" hint-size="14px,14px"></dc-import></span></button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px">
<div style="font-size: 12px; color: var(--text3)">已选 3 个词 · 1.4 秒</div>
<div style="display: flex; gap: 2px; flex-wrap: wrap; margin: 0 -8px">
<dc-import name="Button" variant="danger" size="sm" label="删除" glyph="trash" hint-size="64px,28px"></dc-import>
<dc-import name="Button" variant="quiet" size="sm" label="恢复" glyph="undo" hint-size="64px,28px"></dc-import>
<dc-import name="Button" variant="quiet" size="sm" label="静音" glyph="mute" hint-size="64px,28px"></dc-import>
<dc-import name="Button" variant="quiet" size="sm" label="锁定" glyph="lock" hint-size="64px,28px"></dc-import>
</div>
</div>
</aside>
</div>

<section aria-label="波形" style="height: 304px; flex: none; display: flex; flex-direction: column; border-top: 1px solid var(--gap); background: var(--panel)">
<div style="height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px">
<dc-import name="IconButton" glyph="play" label="播放" solid="{{true}}" hint-size="28px,28px"></dc-import>
<span style="font-size: 13px; font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums">00:03.240</span>
<span style="font-size: 13px; font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; color: var(--text3)">/ 00:10.000</span>
<span style="font-size: 12px; color: var(--text3); margin-left: 8px">已剪去 1.6 秒</span>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 8px"><div role="switch" aria-checked="true" aria-label="自动增益" style="width: 26px; height: 15px; border-radius: 8px; background: var(--accent); position: relative"><div style="position: absolute; right: 2px; top: 2px; width: 11px; height: 11px; border-radius: 6px; background: var(--on-accent)"></div></div><span style="font-size: 12px; color: var(--text2)">自动增益</span></div>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 6px"></span>
<dc-import name="IconButton" glyph="zoomFit" label="适应窗口" hint-size="28px,28px"></dc-import>
<span style="color: var(--text3); display: flex"><dc-import name="Icon" glyph="minus" size="14" hint-size="14px,14px"></dc-import></span>
<div style="width: 110px; height: 2px; border-radius: 1px; background: var(--line-strong); position: relative; margin: 0 6px"><div style="position: absolute; left: 62%; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: var(--text2)"></div></div>
<span style="color: var(--text3); display: flex"><dc-import name="Icon" glyph="plus" size="14" hint-size="14px,14px"></dc-import></span>
<dc-import name="IconButton" glyph="clock" label="快捷键" hint-size="28px,28px"></dc-import>
</div>
<div style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px 10px; gap: 6px">
<div style="height: 16px; display: flex; justify-content: space-between; font-size: 10px; color: var(--text3); font-family: 'Geist Mono', monospace">
<span>0:00</span><span>0:01</span><span>0:02</span><span>0:03</span><span>0:04</span><span>0:05</span><span>0:06</span><span>0:07</span><span>0:08</span><span>0:09</span><span>0:10</span>
</div>
<div style="height: 22px; display: flex; gap: 2px">
<sc-for list="{{lane}}" as="w" hint-placeholder-count="9">
<div style="height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 4px; display: flex; align-items: center; font-size: 11px; overflow: hidden; white-space: nowrap; {{w.s}}">{{w.text}}</div>
</sc-for>
</div>
<div style="position: relative; height: 104px; border-radius: 6px; background: var(--gap)">
<dc-import name="Waveform" mode="standard" bins="1200" seed="7" played="0.324" cuts="0-0.04,0.6-0.65" height="104" label="口播波形" hint-size="100%,104px"></dc-import>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 32.4%; width: 1px; background: var(--accent-ring)"><div style="position: absolute; top: -2px; left: -5px; width: 11px; height: 11px; border-radius: 2px 2px 6px 6px; background: var(--accent-ring)"></div></div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 31%; width: 3%; box-shadow: inset 0 0 0 1px var(--text3); border-radius: 3px"></div>
</div>
<div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: center; gap: 2px"><span style="font-size: 12px; font-weight: 500">放大</span><span style="font-size: 11px; color: var(--text3); font-family: 'Geist Mono', monospace">03.229–03.259</span></div>
<div style="position: relative; height: 62px; border-radius: 6px; background: var(--gap); overflow: hidden">
<dc-import name="Waveform" mode="detail" seed="5" height="62" label="播放头附近的采样级波形" hint-size="100%,62px"></dc-import>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 37%; width: 1px; background: var(--accent-ring)"></div>
</div>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","default":"graphite","options":["graphite","ocean","film","paper"],"section":"主题"},"accent":{"editor":"enum","default":"跟随预设","options":["跟随预设","蓝","紫","青","橙","玫红"],"section":"主题"},"$preview":{"width":1440,"height":900}}'>
