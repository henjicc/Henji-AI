<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>剪辑工作区</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB4FF}a:hover{color:#B3CCFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: Geist, 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; font-size: 13px; background: var(--window); color: var(--text1); {{themeVars}}">
<dc-import name="TitleBar" active="edit" hint-size="100%,40px"></dc-import>

<div style="height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--gap)">
<dc-import name="IconButton" glyph="chevLeft" label="关闭工程" hint-size="28px,28px"></dc-import>
<dc-import name="Button" variant="quiet" size="sm" label="Tripo 宣传片" trailing="chevDown" hint-size="110px,28px"></dc-import>
<span style="font-size: 12px; color: var(--text3)">3840 × 2160 · 60 fps</span>
<div style="flex: 1"></div>
<dc-import name="IconButton" glyph="undo" label="撤销" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="redo" label="重做" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="layout" label="布局" hint-size="28px,28px"></dc-import>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 4px"></span>
<dc-import name="Button" variant="primary" label="导出" glyph="download" hint-size="72px,32px"></dc-import>
</div>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 296px minmax(0, 1fr) 296px; grid-template-rows: minmax(0, 1fr) 340px; gap: 1px; background: var(--gap)">

<section aria-label="项目" style="background: var(--panel); display: flex; flex-direction: column; min-height: 0">
<div style="height: 32px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-bottom: 1px solid var(--line)">
<span style="font-size: 12px; font-weight: 500; height: 32px; display: flex; align-items: center; box-shadow: inset 0 -1.5px 0 var(--text1)">项目</span>
<span style="font-size: 12px; font-weight: 500; color: var(--text3)">效果</span>
<span style="font-size: 12px; font-weight: 500; color: var(--text3)">资产库</span>
</div>
<div style="height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px">
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--text3)"><dc-import name="Icon" glyph="search" size="14" hint-size="14px,14px"></dc-import><input aria-label="搜索素材" placeholder="搜索素材" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text1); font: inherit; font-size: 12px"></div>
<dc-import name="IconButton" glyph="grid" label="网格视图" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="plus" label="导入素材" hint-size="28px,28px"></dc-import>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 0 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; border-radius: 6px; {{it.bg}}">
<div style="width: 52px; height: 30px; flex: none; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--raised); color: var(--text3)">
<sc-if value="{{it.thumb}}" hint-placeholder-val="{{false}}"><dc-import name="Filmstrip" frames="1" seed="{{it.seed}}" height="30" hint-size="52px,30px"></dc-import></sc-if>
<sc-if value="{{it.glyphed}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" glyph="{{it.glyph}}" size="15" hint-size="15px,15px"></dc-import></sc-if>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.name}}</span>
<span style="font-size: 11px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.meta}}</span>
</div>
</div>
</sc-for>
</div>
</section>

<section aria-label="节目监视器" style="background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0">
<div style="height: 32px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-bottom: 1px solid var(--line)">
<span style="font-size: 12px; font-weight: 500; height: 32px; display: flex; align-items: center; box-shadow: inset 0 -1.5px 0 var(--text1)">节目 · 序列 1</span>
<span style="font-size: 12px; font-weight: 500; color: var(--text3)">源</span>
</div>
<div style="flex: 1; min-height: 0; background: var(--media); display: flex; align-items: center; justify-content: center; padding: 14px; position: relative">
<div style="height: 100%; max-height: 360px; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden"><dc-import name="Filmstrip" frames="1" seed="9" height="360" label="节目画面" hint-size="100%,360px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; right: 8px; top: 14px; bottom: 14px; width: 9px; display: flex; gap: 2px">
<div style="flex: 1; border-radius: 1px; background: linear-gradient(0deg, var(--success) 0%, var(--success) 62%, var(--warning) 80%, var(--raised) 80%)"></div>
<div style="flex: 1; border-radius: 1px; background: linear-gradient(0deg, var(--success) 0%, var(--success) 56%, var(--raised) 56%)"></div>
</div>
</div>
<div style="height: 40px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-top: 1px solid var(--line)">
<span style="font-size: 13px; font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; padding: 0 6px; width: 104px">00:00:01:59</span>
<div style="flex: 1; display: flex; justify-content: center; gap: 2px">
<dc-import name="IconButton" glyph="skipBack" label="跳到开头" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="chevLeft" label="上一帧" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="play" label="播放" solid="{{true}}" size="lg" hint-size="32px,32px"></dc-import>
<dc-import name="IconButton" glyph="chevRight" label="下一帧" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="skipFwd" label="跳到结尾" hint-size="28px,28px"></dc-import>
</div>
<dc-import name="Button" variant="quiet" size="sm" label="适应" trailing="chevDown" hint-size="60px,28px"></dc-import>
<dc-import name="IconButton" glyph="pointer" label="选择" on="{{true}}" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="move" label="移动画面" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="comment" label="标注" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="more" label="更多：重新加载、选帧加入资产库、编辑当前帧" hint-size="28px,28px"></dc-import>
</div>
</section>

<section aria-label="效果控件" style="background: var(--panel); display: flex; flex-direction: column; min-height: 0">
<div style="height: 32px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-bottom: 1px solid var(--line)">
<span style="font-size: 12px; font-weight: 500; height: 32px; display: flex; align-items: center; box-shadow: inset 0 -1.5px 0 var(--text1)">效果控件</span>
<span style="font-size: 12px; font-weight: 500; color: var(--text3)">信息</span>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 8px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px">
<span style="font-size: 13px; font-weight: 500">1920-30.mp4</span>
<span style="font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums">视频 1 · 00:00:00:00 – 00:00:02:00</span>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px; font-size: 12px; font-weight: 600; color: var(--text2)"><dc-import name="Icon" glyph="chevDown" size="12" weight="2" hint-size="12px,12px"></dc-import>{{g.name}}</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 20px; border-radius: 6px; {{r.bg}}">
<span style="flex: 1; min-width: 0; font-size: 12px; color: var(--text2)">{{r.label}}</span>
<span style="font-size: 12px; font-variant-numeric: tabular-nums; {{r.color}}">{{r.value}}</span>
<span aria-hidden="true" style="width: 14px; display: flex; justify-content: center; {{r.key}}"><dc-import name="Icon" glyph="keyframe" size="11" weight="2.2" hint-size="11px,11px"></dc-import></span>
</div>
</sc-for>
</div>
</sc-for>
<div><dc-import name="Button" variant="quiet" size="sm" label="添加效果" glyph="plus" hint-size="92px,28px"></dc-import></div>
</div>
</section>

<section aria-label="时间线" style="grid-column: 1 / 4; background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0">
<div style="height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--gap)">
<span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px; background: var(--hover); font-size: 12px; font-weight: 500">序列 1</span>
<dc-import name="IconButton" glyph="plus" label="新建序列" size="sm" hint-size="24px,24px"></dc-import>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 6px"></span>
<dc-import name="IconButton" glyph="pointer" label="选择工具" on="{{true}}" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="scissors" label="剃刀工具" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="hand" label="抓手工具" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="trackSelect" label="向前选择轨道" hint-size="28px,28px"></dc-import>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 6px"></span>
<dc-import name="IconButton" glyph="link" label="链接选择" on="{{true}}" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="magnet" label="吸附" on="{{true}}" hint-size="28px,28px"></dc-import>
<div style="flex: 1"></div>
<span style="font-size: 12px; font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; color: var(--text2); padding: 0 8px">00:00:01:59</span>
<span style="color: var(--text3); display: flex"><dc-import name="Icon" glyph="minus" size="14" hint-size="14px,14px"></dc-import></span>
<div style="width: 96px; height: 2px; border-radius: 1px; background: var(--line-strong); position: relative; margin: 0 6px"><div style="position: absolute; left: 40%; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: var(--text2)"></div></div>
<span style="color: var(--text3); display: flex"><dc-import name="Icon" glyph="plus" size="14" hint-size="14px,14px"></dc-import></span>
</div>
<div style="position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column">
<div style="height: 24px; flex: none; display: grid; grid-template-columns: 196px minmax(0, 1fr); border-bottom: 1px solid var(--line)">
<div style="border-right: 1px solid var(--gap)"></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px; font-size: 10px; color: var(--text3); font-family: 'Geist Mono', monospace">
<span>00:00</span><span>00:02</span><span>00:04</span><span>00:06</span><span>00:08</span><span>00:10</span><span>00:12</span><span>00:14</span>
</div>
</div>
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 196px minmax(0, 1fr); height: {{t.h}}px; border-bottom: 1px solid var(--gap)">
<div style="display: flex; align-items: center; gap: 1px; padding: 0 6px 0 10px; border-right: 1px solid var(--gap); {{t.headBg}}">
<span style="width: 24px; font-size: 11px; font-weight: 600; color: var(--text2); font-family: 'Geist Mono', monospace">{{t.id}}</span>
<span style="flex: 1; min-width: 0; font-size: 11px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.name}}</span>
<sc-for list="{{t.toggles}}" as="g" hint-placeholder-count="3"><dc-import name="IconButton" glyph="{{g.glyph}}" label="{{g.label}}" size="sm" on="{{g.on}}" hint-size="24px,24px"></dc-import></sc-for>
</div>
<div style="position: relative; overflow: hidden; background: var(--window)">
<sc-for list="{{t.clips}}" as="c" hint-placeholder-count="2">
<div style="position: absolute; top: 2px; bottom: 2px; border-radius: 5px; overflow: hidden; {{c.st}}">
<sc-if value="{{c.video}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; opacity: 0.92"><dc-import name="Filmstrip" frames="{{c.frames}}" seed="{{c.seed}}" height="{{c.inner}}" hint-size="100%,42px"></dc-import></div></sc-if>
<sc-if value="{{c.audio}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; right: 0; top: 13px"><dc-import name="Waveform" mode="standard" tone="clip" bins="360" seed="{{c.seed}}" height="{{c.wave}}" hint-size="100%,22px"></dc-import></div></sc-if>
<span style="position: absolute; left: 0; top: 0; max-width: 100%; box-sizing: border-box; padding: 1px 6px; font-size: 10px; line-height: 14px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0)); border-bottom-right-radius: 4px">{{c.name}}</span>
<sc-if value="{{c.sync}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 4px; top: 2px; padding: 0 4px; border-radius: 3px; background: var(--danger); color: #FFFFFF; font-size: 10px; line-height: 14px; font-family: 'Geist Mono', monospace">+15</span></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: calc(196px + (100% - 196px) * 0.17); width: 1px; background: var(--accent-ring)"><div style="position: absolute; top: 4px; left: -5px; width: 11px; height: 11px; border-radius: 2px 2px 6px 6px; background: var(--accent-ring)"></div></div>
</div>
</section>

</div>
</div>
</x-dc>
