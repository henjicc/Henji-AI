<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>画布项目管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8DB4FF}a:hover{color:#B3CCFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; overflow: hidden; font-family: Geist, 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; font-size: 13px; background: var(--window); color: var(--text1); {{themeVars}}">
<dc-import name="TitleBar" active="canvas" hint-size="100%,40px"></dc-import>

<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center">
<div style="width: 100%; max-width: 1200px; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: baseline; gap: 10px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600">画布</h1>
<span style="font-size: 13px; color: var(--text3)">12 个项目</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 8px; width: 220px; height: 32px; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: var(--raised); color: var(--text3)"><dc-import name="Icon" glyph="search" size="15" hint-size="15px,15px"></dc-import><input aria-label="搜索项目" placeholder="搜索项目" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text1); font: inherit; font-size: 13px"></div>
<dc-import name="Button" variant="quiet" label="最近编辑" trailing="chevDown" hint-size="96px,32px"></dc-import>
<div role="radiogroup" aria-label="视图" style="display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--gap)">
<dc-import name="IconButton" glyph="grid" label="网格" on="{{true}}" hint-size="28px,28px"></dc-import>
<dc-import name="IconButton" glyph="list" label="列表" hint-size="28px,28px"></dc-import>
</div>
<span style="width: 1px; height: 16px; background: var(--line); margin: 0 4px"></span>
<dc-import name="Button" variant="quiet" label="导入" glyph="import" hint-size="72px,32px"></dc-import>
<dc-import name="Button" variant="primary" label="新建画布" glyph="plus" hint-size="104px,32px"></dc-import>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 20px; row-gap: 28px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="8">
<a href="#" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text1)">
<div style="position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: var(--panel); {{p.ring}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(circle, var(--line) 1px, transparent 1.2px); background-size: 14px 14px"></div>
<sc-for list="{{p.links}}" as="l" hint-placeholder-count="2">
<div aria-hidden="true" style="position: absolute; height: 1px; background: var(--line-strong); transform-origin: left center; {{l.s}}"></div>
</sc-for>
<sc-for list="{{p.nodes}}" as="n" hint-placeholder-count="3">
<div aria-hidden="true" style="position: absolute; border-radius: 6px; overflow: hidden; background: var(--raised); box-shadow: 0 0 0 1px var(--line); {{n.s}}"><div style="position: absolute; left: 0; right: 0; bottom: 0; top: 22%; {{n.bg}}"></div></div>
</sc-for>
<sc-if value="{{p.hover}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 8px; top: 8px"><dc-import name="IconButton" glyph="more" label="项目操作" tone="media" hint-size="28px,28px"></dc-import></div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; padding: 0 2px">
<span style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span>
<span style="font-size: 12px; color: var(--text3)">{{p.meta}}</span>
</div>
</a>
</sc-for>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","default":"graphite","options":["graphite","ocean","film","paper"],"section":"主题"},"accent":{"editor":"enum","default":"跟随预设","options":["跟随预设","蓝","紫","青","橙","玫红"],"section":"主题"},"$preview":{"width":1440,"height":900}}'>

  const PRESETS = {
    graphite: { name: '石墨', mode: 'dark', hue: 260, tint: 0.006, base: 0.17, accent: '#3A6FDF' },
    ocean: { name: '深海', mode: 'dark', hue: 245, tint: 0.024, base: 0.165, accent: '#3D86E8' },
    film: { name: '胶片', mode: 'dark', hue: 70, tint: 0.013, base: 0.172, accent: '#D9822B' },

      'background: radial-gradient(circle at 40% 60%, rgba(255,170,90,0.35), transparent 40%), linear-gradient(170deg, #2A303A, #171B20)',

      'background: linear-gradient(165deg, #263038, #13181C)',

</body>
</html>
