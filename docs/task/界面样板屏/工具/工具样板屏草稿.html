<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工具样板屏草稿</title>
<style>

@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 数值取自 src/index.css 的石墨主题令牌 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919; --canvas:#161616;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --icon-rest:#737373;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE;
  --danger-solid:#D73E3F; --danger-text:#FB817A; --warning-text:#F5AE39;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:cover; object-position:0 0; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; zoom:1 !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* 软件界面通用零件 */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--window); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.rest { color:var(--icon-rest); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn.secondary { background:var(--control); color:var(--text1); }
.btn.primary { background:var(--accent); color:#fff; height:32px; padding:0 14px; }
.btn.primary svg { color:#fff; }
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.ovl { position:absolute; background:var(--overlay); border:1px solid var(--line-overlay); z-index:20; }


/* 命令带（各工具共用）：44 高，左端返回 + 文件名，右端次要动作 + 唯一主动作 */
.cmd { height:44px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); background:var(--window); position:relative; }
.cmd .nm { font-size:13px; font-weight:var(--w-medium); color:var(--text1); margin:0 6px 0 2px; }
.cmd .st { font-size:12px; color:var(--text3); margin-right:8px; }
.cmd .grow { flex:1; }
.cmd .sep { width:1px; height:18px; background:var(--line-strong); margin:0 6px; }
.cmd .center { position:absolute; left:50%; transform:translateX(-50%); }
.cmd .btn.primary { height:30px; }
.seg { display:flex; gap:2px; padding:2px; border-radius:8px; background:var(--gap); }
.seg span { height:26px; padding:0 12px; display:flex; align-items:center; border-radius:6px; color:var(--text3); font-size:13px; font-weight:var(--w-medium); }
.seg span.cur { background:var(--selected); color:var(--text1); }
.seg.sm span { height:24px; padding:0 10px; font-size:12px; }
.seg.full { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; }
.seg.full span { justify-content:center; }
.ib.mode { background:var(--selected); color:var(--text1); }
.ib.dis { color:#4E4E4E; }

/* ① 工具首页 */
.home { flex:1; min-height:0; display:flex; justify-content:center; }
.home .col { width:1104px; padding-top:32px; }
.home .title { font-size:20px; line-height:28px; font-weight:var(--w-semibold); margin-bottom:20px; }
.tools { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.tool { height:132px; border-radius:10px; background:var(--raised); padding:16px; display:flex; flex-direction:column; --s:20px; }
.tool svg { color:var(--text2); }
.tool .tt { margin-top:14px; font-size:14px; font-weight:var(--w-medium); color:var(--text1); }
.tool .td { margin-top:2px; font-size:12px; color:var(--text3); overflow:hidden; text-overflow:ellipsis; }
.tool .tm { margin-top:auto; font-size:12px; color:var(--text3); display:flex; align-items:center; gap:6px; --s:12px; overflow:hidden; }
.tool .tm svg { color:var(--icon-rest); }
.tool.hov { background:#2c2c2c; }
.recent { margin-top:36px; }
.recent .h { font-size:13px; font-weight:var(--w-medium); color:var(--text2); height:28px; display:flex; align-items:center; margin-bottom:4px; }
.rf { height:36px; display:grid; grid-template-columns:28px 1fr 140px 120px; align-items:center; gap:8px; padding:0 8px; margin:0 -8px; border-radius:6px; font-size:13px; }
.rf svg { color:var(--icon-rest); }
.rf .k { font-size:12px; color:var(--text3); }
.rf .tm { font-size:12px; color:var(--text3); text-align:right; }

/* ② 屏幕录制 */
.rec { flex:1; min-height:0; display:flex; }
.rec .main { flex:1; min-width:0; padding:16px 24px; display:flex; flex-direction:column; gap:16px; }
.rec .bar { display:flex; align-items:center; gap:8px; }
.srcs { display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; }
.src .th { aspect-ratio:16/9; border-radius:8px; background:var(--media) center/cover; }
.src.cur .th { box-shadow:0 0 0 2px var(--accent-ring); }
.src .cap { margin-top:10px; display:flex; align-items:baseline; gap:8px; font-size:13px; color:var(--text1); }
.src .cap small { font-size:12px; color:var(--text3); }
.side { width:336px; flex:none; border-left:1px solid var(--line); background:var(--panel); padding:8px 16px 16px; }
.grp { padding:12px 0; border-bottom:1px solid var(--line); }
.grp:last-child { border-bottom:0; }
.grp .gh { font-size:12px; font-weight:var(--w-semibold); color:var(--text3); height:24px; display:flex; align-items:center; margin-bottom:4px; }
.fr { min-height:32px; display:flex; align-items:center; gap:12px; font-size:12px; color:var(--text3); }
.fr .lb { width:76px; flex:none; }
.fr .ct { flex:1; min-width:0; display:flex; align-items:center; }
.fr .ct.r { justify-content:flex-start; }
.sw { width:30px; height:18px; border-radius:9px; background:var(--accent); position:relative; flex:none; }
.sw::after { content:''; position:absolute; right:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; }
.sw.off { background:#3d3d3d; } .sw.off::after { right:auto; left:2px; background:var(--text2); }
.fld { height:28px; flex:1; border-radius:6px; background:var(--raised); display:flex; align-items:center; padding:0 8px; font-size:13px; color:var(--text1); gap:6px; --s:12px; }
.fld svg { margin-left:auto; color:var(--icon-rest); }
.disc { height:28px; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2); --s:12px; margin-top:4px; }
.disc svg { color:var(--icon-rest); }

/* 停靠工作区通用：面板标签行 32、面板之间 2 像素的缝 */
.dock { flex:1; min-height:0; display:flex; gap:2px; background:var(--gap); }
.pnl { background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0; }
.tabs { height:32px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); font-size:12px; color:var(--text3); }
.tabs span { height:32px; display:flex; align-items:center; padding:0 8px; position:relative; }
.tabs span.cur { color:var(--text1); }
.tabs span.cur.focus::after { content:''; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; border-radius:1px; background:var(--accent); }
.tabs .r { margin-left:auto; display:flex; gap:2px; }
.foot { height:32px; flex:none; border-top:1px solid var(--line); display:flex; align-items:center; padding:0 6px 0 12px; font-size:12px; color:var(--text3); }
.foot .r { margin-left:auto; display:flex; gap:2px; }
.srch { height:28px; margin:8px; border-radius:6px; background:var(--raised); display:flex; align-items:center; gap:6px; padding:0 8px; font-size:12px; color:var(--icon-rest); --s:14px; flex:none; }
.tree .tr { height:28px; display:flex; align-items:center; gap:6px; padding:0 10px; font-size:13px; color:var(--text2); --s:14px; }
.tree .tr svg { color:var(--icon-rest); }
.tree .tr.cat { font-weight:var(--w-medium); }
.tree .tr.sub { padding-left:28px; }
.tree .tr.leaf { padding-left:50px; }
.tree .tr i { margin-left:auto; font-style:normal; font-size:12px; color:var(--icon-rest); }
.tree .tr.hov { background:var(--hover); color:var(--text1); }
.crop2 { background-repeat:no-repeat; }
/* 属性行：名称 88、数值紧跟名称 */
.prow { height:28px; display:flex; align-items:center; padding:0 12px 0 32px; font-size:12px; color:var(--text3); gap:8px; }
.prow .pn { width:96px; flex:none; overflow:hidden; text-overflow:ellipsis; }
.prow .pv { color:var(--text2); font-size:12px; min-width:32px; }
.prow .pv.chg { color:var(--text1); }
.prow .u { color:var(--text3); font-size:11px; }
.slider { width:92px; height:4px; border-radius:2px; background:#3a3a3a; position:relative; flex:none; }
.slider b { position:absolute; top:-5px; width:14px; height:14px; border-radius:50%; background:#cfcfcf; }
.phead { height:32px; display:flex; align-items:center; gap:6px; padding:0 8px; font-size:13px; color:var(--text1); font-weight:var(--w-medium); --s:14px; }
.phead svg { color:var(--icon-rest); }
.phead .r { margin-left:auto; display:flex; }
.transport { height:44px; flex:none; display:flex; align-items:center; gap:4px; padding:0 8px; border-top:1px solid var(--line); background:var(--panel); font-size:12px; color:var(--text3); }
.tc { font-size:15px; color:var(--accent-text); font-variant-numeric:tabular-nums; margin:0 4px 0 8px; }
.tc small { color:var(--text3); font-size:12px; }
.words { height:32px; display:flex; align-items:center; gap:4px; padding:0 8px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; overflow:hidden; }
.words span { height:22px; padding:0 6px; display:flex; align-items:center; border-radius:4px; background:var(--raised); color:var(--text2); }
.words span.del { background:transparent; color:#6a6a6a; text-decoration:line-through; }
.words span.now { color:var(--text1); box-shadow:0 0 0 1px var(--text3) inset; }
.empty2 { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text3); font-size:12px; --s:24px; }
.empty2 svg { color:var(--icon-rest); stroke-width:1.5; }
/* 图片编辑 */
.rail { width:44px; flex:none; background:var(--panel); display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0; }
.rail .ib { color:var(--icon-rest); }
.rail .ib.mode { color:var(--text1); }
.rail .rs { width:20px; height:1px; background:var(--line-strong); margin:4px 0; }
.stage { flex:1; min-width:0; background:var(--media); position:relative; display:flex; align-items:center; justify-content:center; }
.zbar { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); height:36px; display:flex; align-items:center; gap:2px; padding:0 4px; border-radius:10px; background:rgba(33,33,33,.92); border:1px solid var(--line-overlay); font-size:12px; color:var(--text2); }
.zbar .p { min-width:44px; text-align:center; }
.zbar .sep { width:1px; height:16px; background:var(--line-overlay); margin:0 4px; }
.layer { height:44px; display:flex; align-items:center; gap:10px; padding:0 8px 0 12px; font-size:13px; color:var(--text1); }
.layer.cur { background:var(--selected); }
.layer .lt { width:28px; height:28px; border-radius:4px; background:center/cover; box-shadow:0 0 0 1px var(--line-strong); }
.layer .r { margin-left:auto; display:flex; }
.ph2 { height:28px; display:flex; align-items:center; gap:6px; padding:0 8px; font-size:12px; color:var(--text2); font-weight:var(--w-medium); --s:12px; margin-top:6px; }
.ph2 svg { color:var(--icon-rest); }
/* 镜头参考 */
.vps { flex:1; min-width:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; background:var(--gap); }
.vp { position:relative; background:var(--media); overflow:hidden; background-repeat:no-repeat; }
.vp .lab { position:absolute; left:8px; top:8px; height:24px; padding:0 6px 0 8px; display:flex; align-items:center; gap:4px; border-radius:6px; background:rgba(0,0,0,.45); color:#e6e6e6; font-size:12px; --s:12px; }
.vp .lab.r { left:auto; right:8px; }
.vp.act { box-shadow:inset 0 0 0 1px #6a6a6a; }
.obj { height:28px; display:flex; align-items:center; gap:8px; padding:0 8px 0 12px; font-size:13px; color:var(--text1); --s:14px; }
.obj svg { color:var(--icon-rest); }
.obj small { font-size:11px; color:var(--text3); }
.obj .r { margin-left:auto; display:flex; }
.obj.hov { background:var(--hover); }
.ruler { height:24px; display:flex; align-items:flex-end; padding:0 12px; gap:0; font-size:11px; color:var(--text3); border-bottom:1px solid var(--line); }
.ruler span { width:84px; flex:none; border-left:1px solid var(--line-strong); padding-left:4px; height:14px; line-height:12px; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>工具 · 样板屏设计草稿</h1>
  <p class="lead">工具首页与四个工具（屏幕录制、音频编辑、图片编辑、3D 镜头参考）。工具的文档列表页与画布共用同一页，见画布草稿的①②。规律同剪辑样板屏：内容最亮、名字退后、默认值再退后；命令带一条，右端只有一个主动作；面板工具放底栏、静息退到图标灰。</p>
</div>

/* ① 首页：真实最近文件（2026-11-11） */
function home(){
  const tool = (icon, t, d, m, hov) => `<div class="tool ${hov?'hov':''}">${I(icon)}<div class="tt">${t}</div><div class="td">${d}</div>${m?`<div class="tm">${I('clock')}${m}</div>`:''}</div>`;
  const rf = (icon, n, k, tm) => `<div class="rf">${I(icon)}<span>${n}</span><span class="k">${k}</span><span class="tm num">${tm}</span></div>`;
  return `<div class="app shot">${titlebar(['文件','视图','窗口','帮助'])}<div class="home"><div class="col">
    <div class="title">工具</div>
    <div class="tools">

        <div class="ruler num">${['00:00','00:15','01:00','01:15','02:00','02:15','03:00','03:15','04:00','04:15','05:00','05:15','06:00','06:15','07:00','07:15'].map(t=>`<span>${t}</span>`).join('')}</div></div>

if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
