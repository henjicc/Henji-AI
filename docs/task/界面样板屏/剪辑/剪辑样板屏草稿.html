<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>剪辑样板屏草稿</title>
<style>
@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 以下数值取自 src/index.css 的石墨主题令牌 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --control-hover:#313131; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --text-disabled:#4E4E4E;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE; --on-accent:#FFFFFF;
  --danger-solid:#D73E3F; --danger-text:#FB817A; --warning-text:#F5AE39; --success-text:#52CD86;
  /* 草稿新增（见设计说明“突破的规则”） */
  --icon-rest:#737373;
  --clip-video:#2E3654; --clip-video-strip:#262D47; --clip-video-sel:#3B4570;
  --clip-audio:#23423A; --clip-audio-strip:#1C362F; --clip-audio-sel:#2E574C; --clip-wave:#86BFAB;
  --clip-text:#49324F; --clip-text-strip:#3C2941; --clip-text-sel:#5E4166;
  --clip-caption:#473C24; --clip-caption-sel:#5E4F2E;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; font-synthesis:style; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }
svg.i.fill { fill:currentColor; }

/* ───────── 页面外框（不属于软件界面） ───────── */
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; transform-origin:0 0; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:cover; object-position:0 0; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; transform:none !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* ───────── 软件界面 ───────── */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--gap); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.ib.s20 { width:20px; height:20px; --s:12px; border-radius:4px; }
.ib.s32 { width:32px; height:32px; --s:18px; }
.ib.rest { color:var(--icon-rest); }
.ib.strong { color:var(--text1); }
.ib.mode { background:var(--selected); color:var(--text1); }
.ib.on { color:var(--accent-text); }
.ib.hover { background:var(--hover); color:var(--text1); }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn.primary { background:var(--accent); color:var(--on-accent); height:32px; padding:0 14px; }
.btn.secondary { background:var(--control); color:var(--text1); }
.btn.danger-solid { background:var(--danger-solid); color:#fff; }
.btn.sm { height:24px; padding:0 8px; font-size:12px; }

/* 标题栏 40 */
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; border-radius:6px; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.titlebar .wc svg { stroke-width:1.5; }

/* 命令带 44 */
.cmd { height:44px; flex:none; background:var(--panel); display:flex; align-items:center; padding:0 10px; gap:2px; }
.cmd .proj { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:var(--w-medium); border-radius:6px; --s:14px; }
.cmd .proj svg { color:var(--text3); }
.cmd .sep { width:1px; height:16px; background:var(--line-strong); margin:0 10px; }
.cmd .tools { display:flex; gap:2px; }
.cmd .right { margin-left:auto; display:flex; align-items:center; gap:2px; }
.cmd .layout { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2); border-radius:6px; --s:16px; }

/* 停靠区 */
.dock { flex:1; min-height:0; display:flex; gap:2px; padding-top:2px; }
.col { display:flex; flex-direction:column; gap:2px; min-width:0; }
.rowx { display:flex; gap:2px; min-height:0; }
.panel { background:var(--panel); display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
.tabs { height:32px; flex:none; display:flex; align-items:stretch; padding:0 6px; border-bottom:1px solid var(--line); }
.tab { padding:0 8px; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text3); font-weight:var(--w-medium); position:relative; --s:14px; }
.tab.cur { color:var(--text1); }
.tab.cur.focus::after { content:''; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; background:var(--accent-ring); border-radius:1px; }
.tab .pm { color:var(--icon-rest); margin-left:2px; --s:12px; }
.tabs .more { margin-left:auto; display:flex; align-items:center; }
.foot { height:32px; flex:none; border-top:1px solid var(--line); display:flex; align-items:center; padding:0 6px 0 12px; gap:2px; }
.foot .status { font-size:12px; color:var(--text3); margin-right:auto; }

/* 素材面板 */
.search { margin:8px 8px 4px; height:28px; border-radius:8px; background:var(--raised); display:flex; align-items:center; gap:6px; padding:0 8px; color:var(--text3); font-size:12px; --s:14px; }
.lhead { height:24px; display:flex; align-items:center; padding:0 12px 0 34px; font-size:11px; color:var(--text3); gap:4px; --s:12px; }
.lhead .dur { margin-left:auto; }
.item { height:28px; display:flex; align-items:center; padding:0 12px 0 6px; margin:0 4px; border-radius:6px; font-size:13px; gap:8px; }
.item .tw { width:14px; color:var(--icon-rest); --s:12px; display:flex; justify-content:center; }
.item .chip { width:8px; height:8px; border-radius:2px; flex:none; }
.item .ic { color:var(--text3); --s:14px; }
.item .nm { overflow:hidden; text-overflow:ellipsis; }
.item .meta { margin-left:auto; font-size:11px; color:var(--text3); }
.item.sel { background:var(--selected); }
.item.child { padding-left:28px; }

/* 节目画面 */
.viewer { flex:1; min-height:0; background:var(--media); display:flex; align-items:center; justify-content:center; position:relative; }
.frame { position:relative; background:#000 center/cover; overflow:hidden; }
.frame .ttl { position:absolute; left:8.5%; top:30%; font-size:34px; line-height:44px; font-weight:700; color:#fff; letter-spacing:1px; }
.frame .ttl small { display:block; font-size:12px; line-height:18px; font-weight:400; letter-spacing:3px; color:rgba(255,255,255,.78); margin-bottom:6px; }
.frame .cap { position:absolute; left:0; right:0; bottom:7%; text-align:center; font-size:17px; font-weight:500; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); }
.frame .selbox { position:absolute; border:1px solid var(--text1); }
.frame .selbox i { position:absolute; width:7px; height:7px; background:var(--media); border:1px solid var(--text1); }
.scrub { height:20px; flex:none; background:var(--panel); position:relative; border-top:1px solid var(--line); }
.scrub .tick { position:absolute; bottom:0; width:1px; height:5px; background:var(--line-strong); }
.scrub .tick.maj { height:9px; background:#3d3d3d; }
.scrub .lab { position:absolute; top:2px; font-size:10px; line-height:14px; color:var(--icon-rest); }
.scrub .ph { position:absolute; top:0; bottom:0; width:1px; background:var(--accent-ring); }
.scrub .ph::before { content:''; position:absolute; left:-4px; top:0; width:9px; height:8px; background:var(--accent-ring); clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%); }
.transport { height:44px; flex:none; display:flex; align-items:center; padding:0 10px 0 12px; position:relative; }
.transport .tc { font-size:14px; font-weight:var(--w-medium); color:var(--text1); }
.transport .tc small { font-size:12px; color:var(--text3); font-weight:var(--w-normal); margin-left:6px; }
.transport .mid { position:absolute; left:50%; transform:translateX(-50%); display:flex; align-items:center; }
.transport .grp { display:flex; align-items:center; gap:2px; }
.transport .grp + .grp { margin-left:20px; }
.transport .right { margin-left:auto; display:flex; align-items:center; gap:2px; }
.transport .drop { height:28px; padding:0 6px 0 8px; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text2); --s:12px; border-radius:6px; }
.transport .drop svg { color:var(--icon-rest); }

/* 时间线 */
.tl { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
.tl .corner { height:28px; display:flex; align-items:center; padding:0 4px 0 12px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); }
.tl .corner .tc { font-size:15px; line-height:22px; font-weight:var(--w-medium); color:var(--accent-text); margin-right:auto; }
.tl .grid { display:grid; grid-template-columns:232px minmax(0,1fr); flex:1; min-height:0; align-content:start; }
.ruler { height:28px; position:relative; border-bottom:1px solid var(--line); overflow:hidden; background:var(--panel); }
.ruler .tick { position:absolute; bottom:0; width:1px; height:4px; background:var(--line-strong); }
.ruler .tick.maj { height:10px; background:#444; }
.ruler .lab { position:absolute; bottom:1px; font-size:10px; line-height:14px; color:var(--text3); }
.ruler .mk { position:absolute; top:2px; width:8px; height:9px; clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%); }
.th { display:flex; align-items:center; padding:0 6px 0 4px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); background:var(--panel); }
.th .tw { width:16px; display:flex; justify-content:center; color:var(--icon-rest); --s:12px; }
.th .id { width:22px; font-size:11px; font-weight:var(--w-semibold); color:var(--text3); }
.th .nm { flex:1; min-width:0; font-size:12px; color:var(--text2); overflow:hidden; text-overflow:ellipsis; }
.th .slot { width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:var(--icon-rest); --s:14px; border-radius:6px; }
.th .slot.off { color:var(--text1); }
.th.target { background:#242424; }
.th.target .id { color:var(--text1); }
.lane { position:relative; border-bottom:1px solid #232323; background:var(--window); }
.lane.dimmed .clip { opacity:.45; }
.clip { position:absolute; top:2px; bottom:2px; border-radius:4px; overflow:hidden; }
.clip .strip { position:absolute; left:0; right:0; top:0; height:16px; display:flex; align-items:center; padding:0 6px; gap:4px; font-size:11px; line-height:16px; font-weight:var(--w-medium); color:#E2E2E2; }
.clip .strip span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.clip .strip .st { margin-left:auto; flex:none; --s:11px; display:flex; }
.clip .body { position:absolute; left:0; right:0; top:16px; bottom:0; }
.clip.flat .strip { height:100%; background:none !important; }
.clip.video { background:var(--clip-video); } .clip.video .strip { background:var(--clip-video-strip); }
.clip.audio { background:var(--clip-audio); } .clip.audio .strip { background:var(--clip-audio-strip); }
.clip.text { background:var(--clip-text); } .clip.text .strip { background:var(--clip-text-strip); }
.clip.caption { background:var(--clip-caption); }
.clip.caption .strip { font-weight:var(--w-normal); color:#EDE6D6; }
.clip.sel { box-shadow:inset 0 0 0 1px var(--text1); }
.clip.video.sel { background:var(--clip-video-sel); } .clip.video.sel .strip { background:#333C61; }
.clip.audio.sel { background:var(--clip-audio-sel); } .clip.audio.sel .strip { background:#274A41; }
.clip.text.sel { background:var(--clip-text-sel); } .clip.text.sel .strip { background:#513858; }
.clip.caption.sel { background:var(--clip-caption-sel); }
.clip .thumb { position:absolute; left:0; top:0; bottom:0; background:center/cover; }
.clip .wave { position:absolute; left:0; right:0; bottom:0; top:2px; color:var(--clip-wave); }
.clip .wave svg { width:100%; height:100%; display:block; }
.clip .kf { position:absolute; bottom:3px; width:5px; height:5px; background:#D8D8D8; transform:rotate(45deg); margin-left:-2.5px; }
.clip .handle { position:absolute; top:3px; bottom:3px; width:3px; border-radius:2px; background:var(--text1); }
.clip .handle.l { left:2px; } .clip .handle.r { right:2px; }
.clip .fade { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(to bottom right, rgba(0,0,0,.42) 49.5%, transparent 50.5%); }
.clip .fadedot { position:absolute; top:-3px; width:7px; height:7px; border-radius:50%; background:var(--panel); border:1.5px solid var(--text1); margin-left:-3.5px; }
.clip .hatch { position:absolute; inset:0; background:repeating-linear-gradient(135deg, rgba(0,0,0,.2) 0 4px, transparent 4px 8px); }
.clip .msg { position:absolute; left:6px; top:0; bottom:0; display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text2); --s:12px; }
.clip .msg svg, .clip .st.err { color:var(--danger-text); }
.clip.offline { background:#2C2C2C !important; } .clip.offline .strip { background:#262626 !important; color:var(--text3); }
.clip .vol { position:absolute; left:0; right:0; height:1px; background:rgba(255,255,255,.35); }
.playhead { position:absolute; top:0; bottom:0; width:1px; background:var(--accent-ring); z-index:5; pointer-events:none; }
.playhead::before { content:''; position:absolute; left:-5px; top:0; width:11px; height:13px; background:var(--accent-ring); clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%); border-radius:2px; }
.hscroll { height:10px; flex:none; position:relative; margin-left:232px; }
.hscroll i { position:absolute; top:3px; height:4px; border-radius:2px; background:#3A3A3A; }
.zoom { display:flex; align-items:center; gap:6px; color:var(--icon-rest); --s:14px; padding-right:4px; }
.zoom .track { width:88px; height:2px; background:var(--line-strong); border-radius:1px; position:relative; }
.zoom .track i { position:absolute; left:42%; top:-4px; width:10px; height:10px; border-radius:50%; background:var(--text3); }

/* 音频电平 */
.meters { flex:1; display:flex; gap:6px; padding:14px 8px 14px 6px; min-height:0; }
.meters .scale { width:20px; position:relative; font-size:10px; line-height:12px; color:var(--icon-rest); text-align:right; }
.meters .scale span { position:absolute; right:0; transform:translateY(-50%); }
.meters .bar { width:6px; border-radius:2px; background:var(--window); position:relative; overflow:hidden; }
.meters .bar i { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(to top, #3F9E68 0 70%, #C9A23A 70% 88%, #D0524E 88%); background-size:100% 240px; background-position:bottom; }
.meters .bar b { position:absolute; left:0; right:0; height:1px; background:var(--text2); }

/* 属性面板（效果控件 / 调色） */
.insp { flex:1; min-height:0; overflow:hidden; }
.ihead { padding:10px 12px 8px; display:flex; align-items:flex-start; }
.ihead .t { font-size:13px; font-weight:var(--w-medium); line-height:20px; }
.ihead .m { font-size:11px; line-height:16px; color:var(--text3); }
.ihead .ib { margin-left:auto; margin-top:-2px; }
.sec { border-top:1px solid var(--line); padding:4px 0 6px; }
.sh { height:28px; display:flex; align-items:center; padding:0 12px 0 8px; font-size:12px; font-weight:var(--w-semibold); color:var(--text1); gap:2px; }
.sh .tw { width:16px; display:flex; justify-content:center; color:var(--icon-rest); --s:12px; }
.sh .fx { font-size:11px; font-style:italic; color:var(--text3); font-weight:var(--w-normal); width:18px; }
.sh .fx.off { color:var(--text-disabled); text-decoration:line-through; }
.sh .r { margin-left:auto; display:flex; gap:2px; align-items:center; font-weight:var(--w-normal); }
.pr { height:28px; display:flex; align-items:center; padding:0 12px 0 8px; font-size:12px; }
.pr .sw { width:20px; display:flex; justify-content:center; color:var(--icon-rest); --s:12px; flex:none; }
.pr .sw.on { color:var(--accent-text); }
.pr .nm { width:76px; flex:none; color:var(--text3); overflow:hidden; text-overflow:ellipsis; }
.pr .val { flex:1; min-width:0; display:flex; align-items:center; gap:4px; }
.pr .n { color:var(--text2); min-width:40px; }
.pr .n.mod { color:var(--text1); font-weight:var(--w-medium); }
.pr .n u { text-decoration:none; color:var(--text3); margin-left:3px; font-weight:var(--w-normal); }
.pr .n.w56 { width:56px; }
.pr .kfnav { margin-left:auto; display:flex; align-items:center; color:var(--icon-rest); --s:12px; gap:2px; }
.pr .kfnav .d { width:7px; height:7px; background:var(--accent-text); transform:rotate(45deg); margin:0 4px; }
.pr.rightval .val { justify-content:flex-end; }
.pr.rightval .n { text-align:right; min-width:0; }
.fld { height:24px; flex:1; min-width:0; border-radius:6px; background:var(--raised); display:flex; align-items:center; padding:0 6px 0 8px; font-size:12px; color:var(--text1); --s:12px; }
.fld svg { margin-left:auto; color:var(--icon-rest); }
.seg { height:24px; border-radius:6px; background:var(--raised); display:flex; padding:2px; gap:2px; font-size:12px; color:var(--text3); }
.seg span { height:20px; padding:0 9px; display:flex; align-items:center; justify-content:center; border-radius:4px; --s:14px; }
.seg span.cur { background:var(--line-overlay); color:var(--text1); font-weight:var(--w-medium); }
.seg.icons span { padding:0; width:26px; }
.slider { flex:1; height:2px; background:var(--line-strong); border-radius:1px; position:relative; margin:0 10px 0 2px; }
.slider i { position:absolute; left:0; top:0; height:2px; background:var(--text3); border-radius:1px; }
.slider b { position:absolute; top:-4px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--text2); }
.cb { width:14px; height:14px; border-radius:4px; border:1px solid #4a4a4a; display:flex; align-items:center; justify-content:center; --s:10px; color:var(--text1); flex:none; }
.cb svg { stroke-width:2.5; }
.swatch { width:28px; height:16px; border-radius:4px; border:1px solid var(--line-overlay); flex:none; margin-left:4px; }
.txtarea { margin:2px 12px 4px 28px; border-radius:8px; background:var(--raised); padding:6px 8px; font-size:13px; line-height:20px; height:52px; color:var(--text1); white-space:normal; }
.disc { height:28px; display:flex; align-items:center; padding:0 12px 0 28px; font-size:12px; color:var(--text3); gap:4px; --s:12px; }
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text3); font-size:12px; }

/* 示波器与色轮 */
.scope { margin:4px 12px 0; height:104px; border-radius:6px; background:var(--media); position:relative; overflow:hidden; }
.scope svg { position:absolute; left:8px; right:8px; top:8px; bottom:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
.readout { margin:6px 12px 4px; display:flex; align-items:center; gap:10px; font-size:11px; line-height:16px; color:var(--text3); }
.readout b { color:var(--text2); font-weight:var(--w-normal); }
.readout .warn { color:var(--warning-text); display:flex; align-items:center; gap:4px; --s:11px; margin-left:auto; }
.wheels { display:flex; justify-content:space-between; padding:6px 20px 2px 28px; }
.wheel { width:80px; text-align:center; font-size:11px; line-height:16px; color:var(--text3); }
.wheel .w { width:76px; height:76px; margin:0 auto 6px; border-radius:50%; position:relative; background:conic-gradient(from 90deg, #b06a6a, #b0a26a, #7fb06a, #6ab0a2, #6a86b0, #9a6ab0, #b06a8c, #b06a6a); }
.wheel .w::before { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--window); }
.wheel .w::after { content:''; position:absolute; left:50%; top:12px; bottom:12px; width:1px; background:var(--line-strong); box-shadow:0 0 0 0 transparent; }
.wheel .w .hz { position:absolute; top:50%; left:12px; right:12px; height:1px; background:var(--line-strong); }
.wheel .w .puck { position:absolute; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--text1); background:var(--window); margin:-4.5px; z-index:1; }
.wheel b { color:var(--text2); font-weight:var(--w-normal); }

/* 浮层 */
.ovl { position:absolute; background:var(--overlay); border:1px solid var(--line-overlay); z-index:20; }
.menu { border-radius:8px; padding:4px; min-width:208px; font-size:13px; }
.menu .mi { height:28px; display:flex; align-items:center; padding:0 8px 0 6px; border-radius:6px; gap:8px; color:var(--text1); --s:14px; }
.menu .mi .ck { width:14px; color:var(--accent-text); display:flex; }
.menu .mi .k { margin-left:auto; padding-left:24px; font-size:11px; color:var(--icon-rest); }
.menu .mi .k svg { color:var(--icon-rest); }
.menu .mi.hov { background:#353535; }
.menu .mi.dis { color:var(--text-disabled); }
.menu .ms { height:1px; background:var(--line-overlay); margin:4px 6px; }
.errbar { left:12px; bottom:12px; border-radius:8px; padding:8px 8px 8px 12px; display:flex; align-items:center; gap:10px; max-width:520px; }
.errbar .ei { color:var(--danger-text); --s:16px; }
.errbar .et { font-size:13px; line-height:18px; font-weight:var(--w-medium); }
.errbar .em { font-size:12px; line-height:16px; color:var(--text2); }
.errbar .acts { display:flex; gap:4px; margin-left:8px; }
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:30; display:flex; align-items:center; justify-content:center; }
.dialog { position:relative; width:420px; border-radius:12px; padding:20px; display:flex; gap:14px; white-space:normal; }
.dialog .di { width:32px; height:32px; border-radius:8px; background:rgba(215,62,63,.16); color:var(--danger-text); display:flex; align-items:center; justify-content:center; flex:none; --s:16px; }
.dialog .dt { font-size:14px; line-height:20px; font-weight:var(--w-semibold); margin:5px 0 6px; }
.dialog .dm { font-size:13px; line-height:20px; color:var(--text2); margin-bottom:20px; }
.dialog .da { display:flex; justify-content:flex-end; gap:8px; }
.dialog .da .btn { height:32px; padding:0 14px; }
.tip { border-radius:6px; padding:4px 8px; font-size:12px; line-height:16px; color:var(--text1); }

/* 细节放大图 */
.sheet { width:1440px; background:var(--window); padding:28px 32px; display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; align-content:start; white-space:nowrap; }
.sheet.h900 { height:900px; }
.ex h3 { margin:0 0 2px; font-size:13px; line-height:20px; font-weight:var(--w-medium); color:var(--text1); }
.ex p { margin:0 0 10px; font-size:12px; line-height:18px; color:var(--text3); white-space:normal; }
.ex .z { zoom:2; }
.ex .rows { width:330px; }
.ex .cap { font-size:5.5px; line-height:9px; color:var(--text3); margin:3px 0 1px; }
.crop { width:660px; height:150px; background-repeat:no-repeat; border-radius:4px; }
.minitl { display:grid; grid-template-columns:152px 1fr; width:332px; }
.minitl .th { padding-left:2px; }
.minitl .lane, .solo-lane { position:relative; background:var(--window); border-bottom:1px solid #232323; }
.reco { display:inline-block; font-size:11px; line-height:16px; padding:0 6px; border-radius:4px; background:var(--selected); color:var(--text1); margin-left:6px; font-weight:var(--w-normal); vertical-align:1px; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>剪辑工作区 · 样板屏设计草稿</h1>
  <p class="lead">每一屏左边是现在的真实截图，右边是草稿。草稿按 1440×900 原尺寸画，用的是软件里真实的颜色、字体和图标。这是静态画面，不能点。</p>

/* 伪随机，保证每次渲染一致 */
function rng(seed){ let x = seed*9301+49297; return () => (x = (x*9301+49297)%233280)/233280; }
function wavePath(seed, n, env){ const r = rng(seed); let d = `M0 100`; let v=.4;
  for(let i=0;i<=n;i++){ v = Math.max(.05, Math.min(1, v + (r()-.5)*.55)); const e = env?env(i/n):1; const burst = (Math.sin(i/n*40+seed)>.2?1:.35); d += ` L${(i/n*100).toFixed(2)} ${(100 - v*e*burst*86).toFixed(1)}`; }
  return d + ` L100 100 Z`; }
const wave = (seed, n, env) => `<div class="wave"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${wavePath(seed,n||120,env)}" fill="currentColor" opacity=".8"/></svg></div>`;

const PX = 48; // 每秒像素
function clip(c){
  const x = c.x!==undefined ? c.x : c.s*PX, w = c.w!==undefined ? c.w : c.d*PX - 1;
  const cls = ['clip', c.t, c.sel?'sel':'', c.flat?'flat':'', c.offline?'offline':''].join(' ');
  let body = '';
  if(c.thumb) body += `<div class="thumb" style="width:${c.thumbW||46}px;background-image:url('素材/${c.thumb}')"></div>`;
  if(c.thumbEnd) body += `<div class="thumb" style="left:auto;right:0;width:${c.thumbW||46}px;background-image:url('素材/${c.thumbEnd}')"></div>`;
  if(c.wave && !c.fail) body += wave(c.wave, Math.round(w/2.2), c.env);
  if(c.vol) body += `<div class="vol" style="top:${c.vol}%"></div>`;
  if(c.fail) body += `<div class="hatch"></div>` + (w>110 ? `<div class="msg">${I('triangle-alert')}${c.fail}</div>` : '');
  if(c.offline) body += `<div class="hatch"></div>` + (w>90 ? `<div class="msg">${I('file-x')}素材离线</div>` : '');
  if(c.fadeIn) body += `<div class="fade" style="width:${c.fadeIn}px"></div>`;
  (c.kf||[]).forEach(k => body += `<div class="kf" style="left:${k}px"></div>`);
  const st = (c.fail && w<=110) || (c.offline && w<=90) ? `<span class="st err">${I(c.offline?'file-x':'triangle-alert')}</span>` : '';
  const extra = (c.handles?`<i class="handle l"></i><i class="handle r"></i>`:'') + (c.fadeDot!==undefined?`<i class="fadedot" style="left:${c.fadeDot}px;top:17px"></i>`:'');
  const nameB = c.nameOver ? `<div class="strip" style="background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 85%);width:${Math.min(w,130)}px;right:auto"><span>${c.n}</span></div>` : '';
  return `<div class="${cls}" style="left:${x}px;width:${w}px;${c.op?`opacity:${c.op}`:''}">`
    + (c.nameOver ? `<div class="body" style="top:0">${body}</div>${nameB}` : `<div class="strip"><span>${c.n}</span>${st}</div>${c.flat?'':`<div class="body">${body}</div>`}`)
    + extra + `</div>`;
}

function histo(){
  const g = (mu,sg,a) => x => a*Math.exp(-((x-mu)**2)/(2*sg*sg));
  const mk = (fs, seed) => { const r = rng(seed); let d='M0 100'; for(let i=0;i<=120;i++){ const x=i/120; let y = fs.reduce((s,f)=>s+f(x),0) * (0.9+r()*.2); d += ` L${(x*100).toFixed(2)} ${(100-Math.min(96,y*100)).toFixed(1)}`; } return d; };
  const R = mk([g(.22,.06,.5),g(.62,.1,.45),g(.9,.03,.25)],3), G = mk([g(.3,.08,.75),g(.55,.12,.4),g(.86,.04,.3)],5), B = mk([g(.18,.05,.4),g(.7,.09,.62),g(.93,.025,.5)],8);
  const L = mk([g(.27,.08,.55),g(.6,.12,.42),g(.88,.04,.33)],13);
  const grid = [25,50,75].map(x=>`<line x1="${x}" x2="${x}" y1="0" y2="100" stroke="#262626" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const f = (d,c) => `<path d="${d} L100 100 Z" fill="${c}" fill-opacity=".22" stroke="${c}" stroke-opacity=".8" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${grid}${f(R,'#C86B66')}${f(G,'#5FA873')}${f(B,'#6A8BD0')}<path d="${L}" fill="none" stroke="#D6D6D6" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
}

function sheetRows(){
  const A = `<div style="width:300px;background:var(--panel);padding:4px 0">${sh('运动',{fx:1})}${row(sw(),'位置',N('1920','',0,'w56')+N('1080'))}${row(sw(1),'缩放',N('112','%',1))}${row(sw(),'旋转',N('0','°'))}${row(nosw,'混合模式',fld('正常'))}</div>`;
  const B = `<div style="width:300px;background:var(--panel);padding:4px 0">${sh('运动',{fx:1})}<div class="pr rightval">${sw()}<span class="nm">位置</span><span class="val">${N('1920')}<span style="width:12px"></span>${N('1080')}<span style="width:16px"></span></span></div><div class="pr rightval">${sw(1)}<span class="nm">缩放</span><span class="val">${N('112','',1)}<span style="width:16px;color:var(--text3);padding-left:4px">%</span></span></div><div class="pr rightval">${sw()}<span class="nm">旋转</span><span class="val">${N('0')}<span style="width:16px;color:var(--text3);padding-left:4px">°</span></span></div><div class="pr rightval">${nosw}<span class="nm">混合模式</span><span class="val"><span style="width:110px;display:flex">${fld('正常')}</span><span style="width:16px"></span></span></div></div>`;
  return `<div class="sheet shot" style="height:440px">
    <div class="ex"><h3>A　数值紧跟在名字后面<span class="reco">推荐</span></h3><p>名字一列、数值一列，两列挨着，眼睛不用横跨整个面板去对应。单位直接跟在数字后面。下拉、分段、滑杆都从数值列的同一条竖线开始。Premiere 和 After Effects 的效果控件就是这种排法。整套草稿按这个画。</p><div class="z">${A}</div></div>
    <div class="ex"><h3>B　数值靠右（现在的规则）</h3><p>数值贴右边、单位进固定的一列。数字位数能对齐，但名字和数值之间空一大片，这正是现在调色面板“像没填完的表格”的原因。把默认值调暗只能缓解，不能解决。</p><div class="z">${B}</div></div>
  </div>`;
}

/* ───── 页面 ───── */
const SCREENS = [
  { id:1, title:'① 默认布局全貌', before:'现状/01-默认布局.png',
    note:'画面最亮，其余都退后：菜单栏、图标、默认状态的开关一律暗一档；蓝色只剩“导出”、播放头、时间线时间码三处。\n右侧面板组默认 4 个标签（原来 9 个）。播放控制条分成“标记与入出点 / 播放 / 画面”三段，用不了的收进“更多”。时间线的时间码和开关并成一行，轨道更高。',
    html: () => app({sel:'v1', focus:'timeline'}) },
  { id:2, title:'② 选中文字片段：效果控件', before:'现状/02-选中文字.png',
    note:'所有行共用两条竖线：名字一列、数值一列。“字重”一行同时取代原来重复的“字形样式”下拉：可变字体是滑杆（可打关键帧），普通字体就是一个下拉。低频的基线偏移、文字框等收进“更多”。颜色是一个小色块加色号，不再是彩虹圈。',
    html: () => app({sel:'text', insp:'text', focus:'insp'}) },
  { id:3, title:'③ 全能调色', before:'现状/03-全能调色.png',
    note:'示波器有自己的内边距，亮度曲线只描线；读数并成一行，只有超标的那一项用警告色。改过的值亮、默认值暗。三个说不清用途的图标搬到底栏并恢复正常亮度：前后对比、导出 LUT、重置。色轮完整显示，不会被切掉。',
    html: () => app({sel:'v2', insp:'color', focus:'insp'}) },
  { id:4, title:'④ 时间线细节（放大 2 倍）', before:null, note:'', html: sheetTimeline },
  { id:5, title:'⑤ 状态与反馈：画面出错的浮条、右键菜单压在面板上、片段读取失败', before:'现状/05-菜单压在面板上.png',
    note:'浮层一律实底加一圈描边，不用投影。报错只有图标是红的，标题说发生了什么，下面一行说能做什么。',
    html: () => app({sel:'v2', insp:'video', focus:'timeline', err:1, fail:1, menu:[708,538]}) },
  { id:6, title:'⑥ 确认弹窗', before:null, note:'图标单独在左，标题和正文在右边同一列，按钮靠右。只有“删除”是红色实底。', html: () => app({sel:'v1', focus:'timeline', dialog:1}) },
  { id:7, title:'⑦ 备选：属性行的数值放哪', before:null, note:'', html: sheetRows },
];
const page = document.getElementById('page');
SCREENS.forEach(s => {
  const el = document.createElement('section'); el.className = 'block'; el.dataset.id = s.id;
  el.innerHTML = `<h2>${s.title}</h2><p class="note">${s.note}</p><div class="pair">`
    + (s.before ? `<div class="side before-side"><div class="tag"><b>现状</b>（真实截图）</div><img class="shot before" src="${s.before}"></div>` : '')
    + `<div class="side"><div class="tag"><b>草稿</b></div>${s.html()}</div></div>`;
  page.appendChild(el);
});
/* ?s=编号 只看一屏；&v=pair 带现状并排；不带参数时把并排的两屏缩到窗口宽度 */
const q = new URLSearchParams(location.search);
if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
else { const fit = () => document.querySelectorAll('.pair').forEach(p => { const w = p.scrollWidth, a = innerWidth - 80; const z = Math.min(1, a / w); p.style.zoom = z; }); fit(); addEventListener('resize', fit); }
</script>
</body>
