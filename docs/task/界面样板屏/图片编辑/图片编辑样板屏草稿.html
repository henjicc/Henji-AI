<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图片编辑样板屏草稿</title>
<style>
@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 数值取自 src/index.css 的石墨主题令牌 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919; --canvas:#161616;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --icon-rest:#737373;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE;
  --danger-text:#FB817A; --warning-text:#F5AE39;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:contain; object-position:0 0; background:#000; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; zoom:1 !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* 通用零件（与工具、剪辑样板屏草稿同一套） */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--window); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.rest { color:var(--icon-rest); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.ib.mode { background:var(--selected); color:var(--text1); }
.ib.dis { color:#4E4E4E; }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn .chev { color:var(--icon-rest); --s:12px; margin-left:-2px; }
.btn.primary { background:var(--accent); color:#fff; height:30px; padding:0 12px; }
.btn.primary svg { color:#fff; }
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }

/* 命令带：44 高；组与组之间只靠间距，不画竖线 */
.cmd { height:44px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); background:var(--window); }
.cmd .nm { font-size:13px; font-weight:var(--w-medium); color:var(--text1); margin:0 6px 0 2px; }
.cmd .st { font-size:12px; color:var(--warning-text); margin-right:8px; }
.cmd .grow { flex:1; }
.cmd .gp { width:12px; flex:none; }

/* 停靠：面板之间 2 像素的缝 */
.dock { flex:1; min-height:0; display:flex; gap:2px; background:var(--gap); }
.pnl { background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0; }
.tabs { height:32px; flex:none; display:flex; align-items:center; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); font-size:12px; color:var(--text3); }
.tabs span { height:32px; display:flex; align-items:center; padding:0 8px; position:relative; }
.tabs span.cur { color:var(--text1); }
.tabs span.cur.focus::after { content:''; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; border-radius:1px; background:var(--accent); }
.foot { height:32px; flex:none; border-top:1px solid var(--line); display:flex; align-items:center; padding:0 6px 0 12px; font-size:12px; color:var(--text3); }
.foot .r { margin-left:auto; display:flex; gap:2px; }

/* 工具栏与画面 */
.rail { width:44px; flex:none; background:var(--panel); display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0; }
.rail .ib { color:var(--icon-rest); }
.rail .ib.mode { color:var(--text1); }
.rail .rs { width:20px; height:1px; background:var(--line-strong); margin:4px 0; }
.stage { flex:1; min-width:0; background:var(--media); position:relative; display:flex; align-items:center; justify-content:center; }
.pic { position:relative; box-shadow:0 0 0 1px var(--accent-ring); background:center/cover; }
.pic i { position:absolute; width:7px; height:7px; background:var(--text1); border:1px solid #1b1b1b; }
.zbar { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); height:36px; display:flex; align-items:center; gap:2px; padding:0 4px; border-radius:10px; background:var(--overlay); border:1px solid var(--line-overlay); font-size:12px; color:var(--text2); }
.zbar .p { min-width:44px; text-align:center; }

/* 图层列表：行 44，选中整行中性底 */
.layer { height:44px; display:flex; align-items:center; gap:10px; padding:0 6px 0 12px; font-size:13px; color:var(--text1); }
.layer.cur { background:var(--selected); }
.layer .lt { width:28px; height:28px; border-radius:4px; background:center/cover; box-shadow:0 0 0 1px var(--line-strong); flex:none; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.layer .lt.adj { background:var(--raised); box-shadow:none; }
.layer .lt.mask { background:#0d0d0d; }
.layer .lt.mask b { width:11px; height:19px; border-radius:6px 6px 3px 3px; background:#e8e8e8; }
.layer .lt.on { box-shadow:0 0 0 1px var(--text2); }
.layer .r { margin-left:auto; display:flex; }

/* 属性面板：与剪辑效果控件同一套 */
.ohead { padding:10px 8px 10px 12px; display:flex; align-items:flex-start; border-bottom:1px solid var(--line); }
.ohead .t { font-size:13px; font-weight:var(--w-medium); color:var(--text1); line-height:20px; }
.ohead .m { font-size:12px; color:var(--text3); line-height:18px; }
.ohead .r { margin-left:auto; }
.sec { padding:4px 0 8px; border-bottom:1px solid var(--line); }
.sec:last-child { border-bottom:0; }
.sh { height:32px; display:flex; align-items:center; padding:0 8px 0 0; font-size:12px; font-weight:var(--w-semibold); color:var(--text1); }
.sh .cv { width:22px; margin-left:8px; display:flex; justify-content:center; color:var(--icon-rest); --s:12px; }
.sh .r { margin-left:auto; display:flex; }
.prow { height:28px; display:flex; align-items:center; padding:0 8px; font-size:12px; color:var(--text3); }
.prow .sw { width:22px; flex:none; display:flex; justify-content:center; color:var(--icon-rest); --s:12px; }
.prow .pn { width:88px; flex:none; overflow:hidden; text-overflow:ellipsis; }
.prow .pv { color:var(--text2); font-size:12px; padding:0 4px; margin-left:-4px; border-radius:4px; }
.prow .pv.chg { color:var(--text1); }
.prow .u { color:var(--text3); font-size:11px; margin-left:2px; }
.prow .gap2 { width:20px; flex:none; }
.prow .lk { color:var(--icon-rest); --s:12px; margin-left:10px; }
.dd { height:24px; width:150px; border-radius:6px; background:var(--raised); display:flex; align-items:center; padding:0 6px 0 8px; font-size:12px; color:var(--text2); --s:12px; }
.dd svg { margin-left:auto; color:var(--icon-rest); }
.ck { width:14px; height:14px; border-radius:3px; box-shadow:inset 0 0 0 1px #4a4a4a; display:flex; align-items:center; justify-content:center; color:var(--text1); --s:11px; }
.ck.on { box-shadow:inset 0 0 0 1px #5a5a5a; }
.ck.on svg { stroke-width:2.5; }
.seg { display:flex; gap:2px; padding:2px; border-radius:6px; background:var(--gap); }
.seg span { height:20px; padding:0 10px; display:flex; align-items:center; border-radius:4px; color:var(--text3); font-size:12px; }
.seg span.cur { background:var(--selected); color:var(--text1); }
.ann { position:absolute; z-index:30; font-size:12px; line-height:16px; color:#ffd66b; border:1px dashed #ffd66b; border-radius:6px; pointer-events:none; }
.ann span { position:absolute; background:#2a2414; padding:2px 6px; border-radius:4px; white-space:nowrap; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>图片编辑样板屏草稿</h1>
  <p class="lead">右侧属性面板改成和剪辑效果控件同一套：顶上是选中图层的名字，下面是可折叠的分组，每行“秒表列 · 名称 · 紧跟名称的数值”，不再分“参数 / 基础”两页。命令带只留一个布局按钮，次要动作都不带底色，导出是唯一的蓝色。</p>
</div>

/>","plus":"<path d=\"M5 12h14\"/><path d=\"M12 5v14\"/>","timer":"<line x1=\"10\" x2=\"14\" y1=\"2\" y2=\"2\"/><line x1=\"12\" x2=\"15\" y1=\"14\" y2=\"11\"/><circle cx=\"12\" cy=\"14\" r=\"8\"/>","folder-plus":"<path d=\"M12 10v6\"/><path d=\"M9 13h6\"/><path d=\"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z\"/>","copy":"<rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/>","trash-2":"<path d=\"M10 11v6\"/><path d=\"M14 11v6\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M3 6h18\"/><path d=\"M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/>","ellipsis":"<circle cx=\"12\" cy=\"12\" r=\"1\"/><circle cx=\"19\" cy=\"12\" r=\"1\"/><circle cx=\"5\" cy=\"12\" r=\"1\"/>","square-dashed":"<path d=\"M5 3a2 2 0 0 0-2 2\"/><path d=\"M19 3a2 2 0 0 1 2 2\"/><path d=\"M21 19a2 2 0 0 1-2 2\"/><path d=\"M5 21a2 2 0 0 1-2-2\"/><path d=\"M9 3h1\"/><path d=\"M9 21h1\"/><path d=\"M14 3h1\"/><path d=\"M14 21h1\"/><path d=\"M3 9v1\"/><path d=\"M21 9v1\"/><path d=\"M3 14v1\"/><path d=\"M21 14v1\"/>","package":"<path d=\"M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z\"/><path d=\"M12 22V12\"/><polyline points=\"3.29 7 12 12 20.71 7\"/><path d=\"m7.5 4.27 9 5.15\"/>","link":"<path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"/><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"/>","sliders-horizontal":"<path d=\"M10 5H3\"/><path d=\"M12 19H3\"/><path d=\"M14 3v4\"/><path d=\"M16 17v4\"/><path d=\"M21 12h-9\"/><path d=\"M21 19h-5\"/><path d=\"M21 5h-7\"/><path d=\"M8 10v4\"/><path d=\"M8 12H3\"/>","eye":"<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","lock-open":"<rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"/><path d=\"M7 11V7a5 5 0 0 1 9.9-1\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","section":"<path d=\"M16 5a4 3 0 0 0-8 0c0 4 8 3 8 7a4 3 0 0 1-8 0\"/><path d=\"M8 19a4 3 0 0 0 8 0c0-4-8-3-8-7a4 3 0 0 1 8 0\"/>"}/*ICONS_END*/;
const I = (n, s) => `<svg class="i" viewBox="0 0 24 24" ${s?`style="--s:${s}px"`:''}>${ICONS[n]||''}</svg>`;
const ib = (n, cls, s) => `<span class="ib ${cls||''}">${I(n, s)}</span>`;
const PHOTO = '../生成/素材/人像.jpg';
function titlebar(){ return `<div class="titlebar"><span class="brand">痕迹AI</span>
  <div class="menu">${['文件','编辑','图层','视图','窗口','帮助'].map(m=>`<span>${m}</span>`).join('')}</div>
  <div class="nav">${['生成','画布','剪辑','工具','资产'].map(m=>`<span class="${m==='工具'?'cur':''}">${m}</span>`).join('')}</div>
  <div class="right">${ib('sparkles')}${ib('settings')}<span style="width:8px"></span><span class="wc">${I('minus')}</span><span class="wc">${I('square',12)}</span><span class="wc">${I('x')}</span></div></div>`; }

function cmd(){
  return `<div class="cmd">${ib('arrow-left')}<span class="nm">未命名图片 1</span><span class="st">未保存</span>${ib('undo-2')}${ib('redo-2','dis')}
    <span class="grow"></span>
    ${ib('magnet','rest')}<span class="gp"></span>
    ${ib('folder-open','rest')}${ib('save','rest')}${ib('file-pen','rest')}<span class="gp"></span>
    <span class="btn">${I('mic')}讲解</span><span class="btn">${I('layout-grid')}随手摆</span>${ib('layout-panel-left','rest')}<span class="gp"></span>
    <span class="btn">${I('clapperboard')}加入剪辑${I('chevron-down')}</span><span class="btn primary" style="margin-left:4px">${I('download')}导出${I('chevron-down')}</span></div>`;
}
function rail(){
  return `<div class="rail">${ib('move','mode')}${ib('hand')}${ib('zoom-in')}<span class="rs"></span>${ib('crop')}${ib('frame')}${ib('scan')}<span class="rs"></span>${ib('wand-sparkles')}<span class="rs"></span>${ib('type')}<span class="rs"></span>${ib('paintbrush')}${ib('eraser')}${ib('lasso')}${ib('blend')}${ib('paint-bucket')}</div>`;
}
function stage(){
  const h = (l, t) => `<i style="left:${l};top:${t};transform:translate(-50%,-50%)"></i>`;
  return `<div class="stage"><div class="pic" style="width:372px;height:662px;background-image:url('${PHOTO}')">${h('0','0')}${h('50%','0')}${h('100%','0')}${h('0','50%')}${h('100%','50%')}${h('0','100%')}${h('50%','100%')}${h('100%','100%')}</div>
    <div class="zbar">${ib('minus','rest')}<span class="p num">44%</span>${ib('plus','rest')}${ib('scan','rest')}<span class="btn" style="height:28px;font-size:12px">1:1</span></div></div>`;
}
const prow = (n, vals, opts={}) => `<div class="prow"><span class="sw">${opts.sw?I('timer'):''}</span><span class="pn">${n}</span>${vals}</div>`;
const v = (x, u, chg) => `<span class="pv num ${chg?'chg':''}">${x}</span>${u?`<span class="u">${u}</span>`:''}`;
const sec = (t, body, right) => `<div class="sec"><div class="sh"><span class="cv">${I('chevron-down')}</span>${t}${right?`<span class="r">${right}</span>`:''}</div>${body}</div>`;

function layersPanel(rows, count, h=330){
  return `<div class="pnl" style="height:${h}px;flex:none"><div class="tabs"><span class="cur focus">图层</span><span>历史</span><span>通道</span><span>调整与滤镜</span><span>颜色</span></div>
    <div style="flex:1;padding-top:4px">${rows}</div>
    <div class="foot"><span>${count}</span><span class="r">${ib('plus','rest s24')}${ib('folder-plus','rest s24')}${ib('copy','rest s24')}${ib('trash-2','rest s24')}${ib('ellipsis','rest s24')}</span></div></div>`;
}
function propsPanel(head, sections, foot){
  return `<div class="pnl" style="flex:1"><div class="tabs"><span class="cur">属性</span></div>
    ${head}<div style="flex:1;overflow:hidden">${sections}</div>
    <div class="foot"><span>${foot}</span><span class="r">${ib('square-dashed','rest s24')}${ib('package','rest s24')}${ib('ellipsis','rest s24')}</span></div></div>`;
}
const transform = sec('变换',
  prow('位置', v('0')+'<span class="gap2"></span>'+v('0'), {sw:1}) +
  prow('缩放', v('100','%')+`<span class="lk">${I('link')}</span>`, {sw:1}) +
  prow('旋转', v('0','°'), {sw:1}));
const compose = (clip) => sec('合成',
  prow('不透明度', v('100','%')) +
  prow('填充', v('100','%')) +
  prow('混合模式', `<span class="dd">正常${I('chevron-down')}</span>`) +
  (clip ? prow('剪贴蒙版', `<span class="ck"></span>`) : ''));

/* ① 选中最底下的图片图层（与现状同一状态） */
function screen1(){
  const rows = `<div class="layer"><span class="lt adj">${I('sliders-horizontal')}</span>全能调色<span class="r">${ib('eye','rest s24')}${ib('lock-open','rest s24')}</span></div>
    <div class="layer cur"><span class="lt" style="background-image:url('${PHOTO}')"></span>原图<span class="r">${ib('eye','rest s24')}${ib('lock-open','rest s24')}</span></div>`;
  const head = `<div class="ohead"><div><div class="t">原图</div><div class="m num">图片图层 · 1080 × 1920</div></div></div>`;
  return `<div class="app shot">${titlebar()}${cmd()}<div class="dock">${rail()}${stage()}
    <div style="width:360px;flex:none;display:flex;flex-direction:column;gap:2px">${layersPanel(rows,'2 个图层')}${propsPanel(head, transform + compose(false), '')}</div></div></div>`;
}

/* ② 选中带蒙版、不在最底下的图层：多出剪贴蒙版与蒙版分组 */
function screen2(){
  const rows = `<div class="layer"><span class="lt adj">${I('sliders-horizontal')}</span>全能调色<span class="r">${ib('eye','rest s24')}${ib('lock-open','rest s24')}</span></div>
    <div class="layer cur"><span class="lt" style="background-image:url('${PHOTO}')"></span><span class="lt mask on" style="margin-left:-6px"><b></b></span>人物<span class="r">${ib('eye','rest s24')}${ib('lock-open','rest s24')}</span></div>
    <div class="layer"><span class="lt" style="background-image:url('${PHOTO}');filter:blur(1px) brightness(.8)"></span>原图<span class="r">${ib('eye','rest s24')}${ib('lock-open','rest s24')}</span></div>`;
  const head = `<div class="ohead"><div><div class="t">人物</div><div class="m num">图片图层 · 1080 × 1920 · 带蒙版</div></div></div>`;
  const mask = sec('蒙版',
    prow('编辑', `<span class="seg"><span>内容</span><span class="cur">蒙版</span></span>`) +
    prow('浓度', v('100','%')) +
    prow('启用', `<span class="ck on">${I('check')}</span>`) +
    prow('跟随图层', `<span class="ck on">${I('check')}</span>`) +
    prow('反相', `<span class="ck"></span>`), ib('trash-2','rest s24'));
  return `<div class="app shot">${titlebar()}${cmd()}<div class="dock">${rail()}${stage()}
    <div style="width:360px;flex:none;display:flex;flex-direction:column;gap:2px">${layersPanel(rows,'3 个图层 · 已选 1', 220)}${propsPanel(head, transform + compose(true) + mask, '')}</div></div></div>`;
}

const SCREENS = [
  { id:1, title:'① 选中图片图层', before:'现状/01-图片编辑.webp', html: screen1,
    note:'属性面板：去掉“参数 / 基础”两页，改成一页从上往下：选中图层的名字和类型 → 变换 → 合成（不透明度、填充、混合模式）。名称、显示、锁定已在图层行上，属性里不再重复一遍；改名在图层行上双击。\n每行与剪辑效果控件一样：最左一列是秒表（能做关键帧的才有），名称 88 宽，数值紧跟名称从同一条竖线开始，数字不画框；位置不再写“0 X 0 Y”，两个数就是 X、Y（悬停说明里写）。\n“转换为智能对象”“添加蒙版”两个带底色的按钮挪到属性面板底栏，静息是图标灰。\n命令带：两个一样的图标原来是“面板”菜单和“工作区布局”菜单，只留布局一个；面板的显示与关闭进菜单栏“窗口”（剪辑已经这样做）。“加入剪辑”去掉底色，导出是唯一的蓝色；组与组之间只靠间距，不画竖线。\n图层面板：调整图层的缩略图位放调整图标，不再是一个空方块；选中行整行中性底（现状的选中底没铺到眼睛和锁那一列）。' },
  { id:2, title:'② 选中带蒙版的图层', before:'现状/01-图片编辑.webp', html: screen2,
    note:'有蒙版时才出现“蒙版”分组：编辑对象（内容 / 蒙版）、浓度、启用、跟随图层、反相；删除蒙版放在分组标题右端（图标灰）。不在最底下的图层，“合成”里多一行“剪贴蒙版”。勾选用停靠面板的复选框外观。\n图层行里蒙版缩略图紧跟内容缩略图，正在编辑蒙版时蒙版缩略图描一圈细线。' },
];
const page = document.getElementById('page');
SCREENS.forEach(s => {
  const el = document.createElement('section'); el.className = 'block'; el.dataset.id = s.id;
  el.innerHTML = `<h2>${s.title}</h2><p class="note">${s.note}</p><div class="pair">`
    + (s.before ? `<div class="side before-side"><div class="tag"><b>现状</b>（你的截图）</div><img class="shot before" src="${s.before}"></div>` : '')
    + `<div class="side"><div class="tag"><b>草稿</b></div>${s.html()}</div></div>`;
  page.appendChild(el);
});
const q = new URLSearchParams(location.search);
if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
else { const fit = () => document.querySelectorAll('.pair').forEach(p => { p.style.zoom = Math.min(1, (innerWidth - 80) / p.scrollWidth); }); fit(); addEventListener('resize', fit); }
</script>
</body>
</html>
