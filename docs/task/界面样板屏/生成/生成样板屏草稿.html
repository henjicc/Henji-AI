<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成样板屏草稿</title>
<style>
@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 数值取自 src/index.css 的石墨主题令牌；--icon-rest 是剪辑样板屏新增的静息图标灰 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --text-disabled:#4E4E4E; --icon-rest:#737373;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE; --on-accent:#FFFFFF;
  --danger-solid:#D73E3F; --danger-text:#FB817A; --warning-text:#F5AE39;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; font-synthesis:style; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }

/* 页面外框（不属于软件界面） */
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:cover; object-position:0 0; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; zoom:1 !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* 软件界面 */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--window); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.ib.rest { color:var(--icon-rest); }
.ib.on { color:var(--accent-text); }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:12px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn.secondary { background:var(--control); color:var(--text1); }
.btn.sm { height:24px; padding:0 8px; }
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.titlebar .wc svg { stroke-width:1.5; }

/* 生成工作区：历史记录维持现在的结构（参考素材 + 提示词 + 模型时间在上，结果在下），输入面板有底部、左侧两个位置 */
.gen { flex:1; min-height:0; display:flex; position:relative; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; position:relative; }
.col { width:1104px; }
.left-mode .col { width:auto; align-self:stretch; margin:0 32px; }
.filters { height:52px; flex:none; display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--line); }
.filters .f { height:28px; padding:0 10px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text3); font-weight:var(--w-medium); }
.filters .f.cur { background:var(--selected); color:var(--text1); }
.filters .r { margin-left:auto; display:flex; gap:2px; align-items:center; }
.feed { flex:1; min-height:0; overflow:hidden; }
.dock-space { flex:none; }
.rec { padding:20px 0; border-bottom:1px solid var(--line); }
.rec:last-child { border-bottom:0; }
.rhead { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.stack { width:40px; height:40px; border-radius:6px; background:var(--raised) center/cover; position:relative; flex:none; box-shadow:3px 3px 0 -1px var(--line-strong); }
.stack b { position:absolute; right:-4px; bottom:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--overlay); border:1px solid var(--line-overlay); color:var(--text2); font-size:10px; line-height:14px; text-align:center; font-weight:var(--w-normal); }
.rtitle { min-width:0; flex:1; }
.rtitle .p { font-size:14px; line-height:22px; color:var(--text1); font-weight:var(--w-medium); white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:880px; }
.rtitle .m { font-size:12px; line-height:18px; color:var(--text3); margin-top:2px; }
.rhead .acts { display:flex; gap:2px; flex:none; }
.results { display:flex; gap:8px; flex-wrap:wrap; }
.res { height:236px; border-radius:8px; background:var(--media) center/cover; position:relative; overflow:hidden; flex:none; }
.res .chip { position:absolute; right:8px; bottom:8px; height:20px; padding:0 6px; border-radius:4px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:20px; }
.res .play { position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; --s:18px; }
.res.pending { background:var(--raised); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--text3); font-size:12px; }
.res.pending .bar { width:120px; height:2px; border-radius:1px; background:var(--line-strong); position:relative; overflow:hidden; }
.res.pending .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--text2); }
/* 错误提示：淡红底的一条，图标红色；说清发生了什么、能做什么，原始信息收进“详情” */
.fail { display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 8px 6px 12px; border-radius:8px; background:rgba(215,62,63,.12); width:max-content; max-width:100%; }
.fail .fi { color:var(--danger-text); --s:16px; }
.fail .ft { font-size:13px; color:var(--text1); font-weight:var(--w-medium); }
.fail .fm { font-size:12px; color:var(--text2); }
.fail .fa { display:flex; gap:4px; margin-left:12px; }

/* 输入面板 · 底部：位置与结构同现在，参数条的名字退一档 */
.composer { position:absolute; left:50%; transform:translateX(-50%); bottom:20px; width:1152px; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:14px 14px 10px; }
.refs { display:flex; gap:8px; margin-bottom:12px; }
.ref { width:48px; height:60px; border-radius:6px; background:var(--raised) center/cover; position:relative; display:flex; align-items:center; justify-content:center; color:var(--icon-rest); flex:none; }
.ref b { position:absolute; left:3px; top:3px; min-width:14px; height:14px; border-radius:4px; background:rgba(0,0,0,.65); color:#fff; font-size:10px; line-height:14px; text-align:center; font-weight:var(--w-normal); }
.prompt { font-size:14px; line-height:22px; color:var(--text1); min-height:44px; white-space:normal; padding:0 4px; }
.prompt.ph { color:var(--icon-rest); }
.pbar { display:flex; align-items:center; gap:2px; height:32px; margin-top:8px; }
.model { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); --s:12px; }
.model small { font-size:12px; color:var(--text3); font-weight:var(--w-normal); }
.model svg { color:var(--icon-rest); }
.model.open { background:var(--selected); }
.pbar .param { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; color:var(--text1); --s:12px; }
.pbar .param label { color:var(--text3); font-size:12px; }
.pbar .param svg { color:var(--icon-rest); }
.pbar .right { margin-left:auto; display:flex; align-items:center; gap:2px; }
.price { font-size:12px; color:var(--text3); }
.send { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; margin-left:6px; --s:16px; flex:none; }
.sw { width:30px; height:18px; border-radius:9px; background:var(--accent); position:relative; flex:none; }
.sw::after { content:''; position:absolute; right:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; }
.sw.off { background:#3d3d3d; } .sw.off::after { right:auto; left:2px; background:var(--text2); }

/* 输入面板 · 左侧：同一个面板竖着放，参数不折叠，一次全摊开 */
.lp { width:360px; flex:none; margin:16px 0 16px 16px; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.lp .body { flex:1; min-height:0; overflow:hidden; padding:14px 14px 0; display:flex; flex-direction:column; gap:16px; }
.lp .lab { font-size:12px; color:var(--text3); height:18px; display:flex; align-items:center; margin-bottom:6px; }
.lp .lab span { margin-left:auto; font-size:11px; color:var(--icon-rest); }
.lp .mrow { height:36px; border-radius:8px; background:var(--raised); display:flex; align-items:center; padding:0 10px; gap:6px; font-size:13px; font-weight:var(--w-medium); --s:12px; }
.lp .mrow small { font-size:12px; color:var(--text3); font-weight:var(--w-normal); }
.lp .mrow svg { margin-left:auto; color:var(--icon-rest); }
.lp .refs { margin:0; flex-wrap:wrap; gap:6px; }
.lp .ref { width:61px; height:61px; }
.lp .ptext { border-radius:8px; background:var(--raised); padding:8px 10px; font-size:13px; line-height:20px; height:112px; color:var(--text1); white-space:normal; position:relative; }
.lp .ptext .tools { position:absolute; right:4px; bottom:4px; display:flex; gap:2px; }
.lp .rows { display:flex; flex-direction:column; gap:4px; }
.lp .row { min-height:32px; display:flex; align-items:center; font-size:12px; }
.lp .row .nm { width:76px; flex:none; color:var(--text3); }
.lp .seg { min-height:28px; flex:1; border-radius:6px; background:var(--raised); display:flex; padding:2px; gap:2px; font-size:12px; color:var(--text3); }
.lp .seg span { flex:1; min-height:24px; display:flex; align-items:center; justify-content:center; border-radius:4px; }
.lp .seg span.cur { background:var(--line-overlay); color:var(--text1); font-weight:var(--w-medium); }
.lp .chips { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
.lp .chips span { height:28px; border-radius:6px; background:var(--raised); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text3); }
.lp .chips span.cur { background:var(--line-overlay); color:var(--text1); font-weight:var(--w-medium); }
.lp .row .sw { margin-left:auto; }
.lp .foot { flex:none; border-top:1px solid var(--line); padding:12px 14px; display:flex; align-items:center; gap:12px; }
.lp .foot .tools { display:flex; gap:2px; }
.lp .go { height:36px; flex:1; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; font-size:14px; font-weight:var(--w-medium); --s:16px; }

/* 右键菜单 */
.menu { border-radius:8px; padding:4px; min-width:220px; font-size:13px; }
.menu .mi2 { height:28px; display:flex; align-items:center; padding:0 10px; border-radius:6px; gap:8px; color:var(--text1); --s:14px; }
.menu .mi2 .k { margin-left:auto; padding-left:32px; font-size:12px; color:var(--text3); }
.menu .mi2.hov { background:#353535; }
.menu .mi2 svg { color:var(--text3); }
.menu .ms { height:1px; background:var(--line-overlay); margin:4px 6px; }

/* 模型面板（浮层：实底加一圈描边，不用投影） */
.ovl { position:absolute; background:var(--overlay); border:1px solid var(--line-overlay); z-index:20; }
.mp { border-radius:12px; width:760px; height:430px; display:flex; flex-direction:column; overflow:hidden; }
.mp .top { height:44px; flex:none; display:flex; align-items:center; gap:8px; padding:0 8px; border-bottom:1px solid var(--line-overlay); }
.mp .search { flex:1; height:28px; border-radius:8px; background:#303030; display:flex; align-items:center; gap:6px; padding:0 8px; color:var(--text3); font-size:12px; --s:14px; }
.mp .seg { display:flex; gap:2px; font-size:12px; color:var(--text3); }
.mp .seg span { height:24px; padding:0 8px; display:flex; align-items:center; border-radius:6px; }
.mp .seg span.cur { background:#3a3a3a; color:var(--text1); font-weight:var(--w-medium); }
.mp .body { flex:1; min-height:0; display:flex; }
.mp .nav { width:148px; flex:none; border-right:1px solid var(--line-overlay); padding:6px 4px; }
.mp .nav .n { height:28px; display:flex; align-items:center; padding:0 8px; border-radius:6px; font-size:12px; color:var(--text2); gap:6px; --s:14px; }
.mp .nav .n.cur { background:#3a3a3a; color:var(--text1); }
.mp .nav .n i { margin-left:auto; font-style:normal; font-size:11px; color:var(--icon-rest); }
.mp .nav .h { height:24px; display:flex; align-items:center; padding:0 8px; font-size:11px; color:var(--icon-rest); margin-top:6px; }
.mp .list { flex:1; min-width:0; padding:6px 6px 0; overflow:hidden; }
.mp .list .h { height:24px; display:flex; align-items:center; padding:0 8px; font-size:11px; color:var(--text3); }
.mp .grid { display:grid; grid-template-columns:1fr 1fr 1fr; column-gap:4px; }
.mp .mi { height:32px; display:flex; align-items:center; padding:0 10px; border-radius:6px; background:#303030; margin-bottom:4px; font-size:13px; color:var(--text1); gap:6px; min-width:0; --s:12px; }
.mp .mi span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.mp .mi small { margin-left:auto; font-size:11px; color:var(--icon-rest); flex:none; }
.mp .mi.cur { background:#295CCB; color:#fff; }
.mp .mi.cur small { color:rgba(255,255,255,.8); }
.mp .mi.cur svg { color:var(--accent-text); flex:none; }
.mp .mi.hov { background:#323232; }

/* 空状态 */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text3); font-size:13px; padding-bottom:170px; }
.empty .ei { color:var(--icon-rest); --s:28px; margin-bottom:6px; }
.empty .ei svg { stroke-width:1.5; }

/* 细节放大图 */
.sheet { width:1440px; background:var(--window); padding:28px 32px; display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; align-content:start; white-space:nowrap; }
.ex h3 { margin:0 0 2px; font-size:13px; line-height:20px; font-weight:var(--w-medium); color:var(--text1); }
.ex p { margin:0 0 10px; font-size:12px; line-height:18px; color:var(--text3); white-space:normal; }
.ex .z { zoom:1.5; }
.crop { width:660px; background-repeat:no-repeat; border-radius:4px; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>生成工作区 · 样板屏设计草稿</h1>
  <p class="lead">第三版：历史记录、模型面板、筛选维持现在的样子，只按统一风格小收拾；改动集中在输入面板（可以放底部或左侧）和错误提示。左边是真实截图，右边是草稿，静态画面不能点。</p>
</div>

=\"M3 15h18\"/>","section":"<path d=\"M16 5a4 3 0 0 0-8 0c0 4 8 3 8 7a4 3 0 0 1-8 0\"/><path d=\"M8 19a4 3 0 0 0 8 0c0-4-8-3-8-7a4 3 0 0 1 8 0\"/>"}/*ICONS_END*/;
const I = (n, s) => `<svg class="i" viewBox="0 0 24 24" ${s?`style="--s:${s}px"`:''}>${ICONS[n]||''}</svg>`;
const ib = (n, cls, s) => `<span class="ib ${cls||''}">${I(n, s)}</span>`;
/* 提示词、模型与时间取自真实历史记录（2026-11-10 的资料目录） */
const P = {
  icon: '极简 SVG 矢量图标：一只可爱卡通小猫头像，橘白配色，圆脸，大圆眼睛，粉色小鼻子，两侧三角形耳朵，纯色底，只保留最少的路径和纯色块，线条干净，无渐变无阴影无文字',
  sticker: '一只可爱的卡通小猫贴纸形象：圆润简洁的造型，大头小身子，大圆眼睛，橘白配色，粉色小鼻子，微笑坐姿，正面全身，扁平矢量插画风格，干净纯色浅灰背景，居中构图，无明显投影',

function titlebar(){ return `<div class="titlebar"><span class="brand">痕迹AI</span>

function filters(){ return `<div class="filters col"><span class="f cur">全部类型</span><span class="f">图片</span><span class="f">视频</span><div class="r">${ib('search')}${ib('ellipsis')}</div></div>`; }
const acts = `<div class="acts">${ib('refresh-cw','rest')}${ib('square-pen','rest')}${ib('download','rest')}${ib('folder-plus','rest')}${ib('list-plus','rest')}${ib('trash-2','rest')}</div>`;
/** 记录头：参考素材叠成一小摞（右下角是张数）、提示词最多两行、下面一行类型 · 模型 · 时间；悬停才出现操作 */
function head(o){
  const stack = o.ref ? `<span class="stack" style="background-image:url('素材/${o.ref}')">${o.refCount>1?`<b class="num">${o.refCount}</b>`:''}</span>` : '';
  return `<div class="rhead">${stack}<div class="rtitle">${o.p?`<div class="p">${o.p}</div>`:''}<div class="m num" style="${o.p?'':'margin-top:10px'}">${o.m}</div></div>${o.hover?acts:''}</div>`;
}
const img = (file, w) => `<div class="res" style="width:${w}px;background-image:url('素材/${file}')"></div>`;
function feed(o){
  const pending = `<div class="rec">${head({p:P.sticker, m:'图片 · KIE：GPT Image 2.6 · 生成中'})}<div class="results"><div class="res pending" style="width:236px"><span class="num">62%</span><div class="bar"><i style="width:62%"></i></div></div><div class="res pending" style="width:236px"><span>排队中</span><div class="bar"><i style="width:0"></i></div></div></div></div>`;
  const fail = `<div class="rec">${head({p:P.loop, ref:'猫-贴纸.jpg', refCount:3, m:'视频 · KIE：Seedance 2.0 Fast · 昨天 16:52'})}<div class="fail"><span class="fi">${I('triangle-alert')}</span><span class="ft">没生成出来</span><span class="fm">请求太频繁，过一会儿再试</span><div class="fa"><span class="btn sm secondary">重试</span><span class="btn sm">详情</span><span class="btn sm">问助手</span></div></div></div>`;
  const icon = `<div class="rec">${head({p:P.icon, m:'图片 · KIE：GPT Image 2.6 · 昨天 16:47', hover:1})}<div class="results">${img('猫-头像.jpg',236)}</div></div>`;
  const i2i = `<div class="rec">${head({p:'', ref:'参考-人像.jpg', refCount:1, m:'图片 · KIE：FLUX 3 Klein · 昨天 00:47'})}<div class="results">${img('人像.jpg',133)}</div></div>`;
  return `<div class="feed col">${o.short ? fail+icon+i2i : pending+fail+icon}</div>`;
}
const PROMPT = '同一只橘白小猫，换成站姿，举起右爪打招呼，保持贴纸风格和浅灰背景';
function composer(o){
  const refs = o.refs ? `<div class="refs"><div class="ref" style="background-image:url('素材/猫-贴纸.jpg')"><b>1</b></div><div class="ref" style="background-image:url('素材/猫-坐姿.jpg')"><b>2</b></div><div class="ref">${I('plus',16)}</div></div>` : '';
  const prompt = o.prompt ? `<div class="prompt">${PROMPT}</div>` : `<div class="prompt ph">描述想要生成的内容</div>`;
  return `<div class="composer">${refs}${prompt}
    <div class="pbar">${ib('plus')}<span class="model ${o.model?'open':''}">FLUX 3 Klein <small>KIE</small>${I(o.model?'chevron-up':'chevron-down')}</span>
      <span class="param"><label>分辨率</label>智能 / 1K${I('chevron-down')}</span><span class="param"><label>数量</label><span class="num">1</span>${I('chevrons-up-down')}</span><span class="param"><label>提示词增强</label><span class="sw"></span></span>
      <div class="right"><span class="price num" style="margin-right:8px">预估 ¥0.054</span>${ib('bookmark','rest')}${ib('wand-sparkles','rest')}<span class="send">${I('arrow-up')}</span></div></div></div>`;
}
/** 左侧位置：同一个输入面板竖着放。上下空间够，这个模型的参数全部摊开，不收进“更多参数” */
function leftPanel(o){
  const row = (n, c) => `<div class="row"><span class="nm">${n}</span>${c}</div>`;
  const seg = (items, cur) => `<span class="seg">${items.map(t=>`<span class="${t===cur?'cur':''}">${t}</span>`).join('')}</span>`;
  const chips = (items, cur) => `<span class="chips">${items.map(t=>`<span class="${t===cur?'cur':''}">${t}</span>`).join('')}</span>`;
  return `<div class="lp">
    <div class="body">
      <div class="mrow">Seedance 2.0 Fast <small>KIE</small>${I('chevron-down')}</div>
      <div><div class="lab">参考素材<span class="num">3 / 9</span></div><div class="refs"><div class="ref" style="background-image:url('素材/猫-贴纸.jpg')"><b>1</b></div><div class="ref" style="background-image:url('素材/猫-坐姿.jpg')"><b>2</b></div><div class="ref" style="background-image:url('素材/猫-头像.jpg')"><b>3</b></div><div class="ref">${I('plus',18)}</div></div></div>
      <div><div class="lab">提示词</div><div class="ptext">${P.loop.slice(0, 58)}……<div class="tools">${ib('bookmark','s24 rest')}${ib('wand-sparkles','s24 rest')}</div></div></div>
      <div class="rows">
        ${row('模式', seg(['文生视频','首尾帧','多图参考'],'多图参考'))}
        ${row('比例', chips(['自适应','16:9','9:16','1:1','4:3','3:4','21:9'],'1:1'))}
        ${row('分辨率', seg(['480p','720p','1080p'],'720p'))}
        ${row('时长', seg(['4 秒','5 秒','8 秒','10 秒','15 秒'],'5 秒'))}
        ${row('生成音频', `<span class="sw off"></span>`)}
        ${row('联网搜索', `<span class="sw off"></span>`)}
        ${row('返回尾帧', `<span class="sw"></span>`)}
      </div>
    </div>
    <div class="foot"><span class="price num">预估 ¥1.20</span><span class="go">生成${I('arrow-up')}</span></div>
  </div>`;
}
function modelPanel(o){
  const m = (n, p, st) => `<div class="mi ${st||''}"><span>${n}</span><small>${p}</small></div>`;
  const rows = [['FLUX 3 Klein','KIE','cur'],['GPT Image 2.6','KIE'],['GPT Image 2.5','KIE'],['Grok Imagine Image 2.0','KIE'],['GPT Image 2','KIE'],['Grok Imagine 图片','KIE'],['Z-Image Turbo','KIE'],['Nano Banana 2.1','KIE'],['Nano Banana 2','KIE'],['Nano Banana 2 Lite','KIE'],['Nano Banana Pro','KIE'],['Qwen Image 3.0','KIE'],['Seedream 5.0 Lite','KIE'],['Seedream 5.0 Pro','KIE'],['Seedream 4.5','KIE'],['Seedream 4.0','KIE'],['FLUX 3 Image','APIMart'],['GPT Image 2.6','APIMart'],['GPT Image 2.5','APIMart'],['GPT Image 2','APIMart'],['Midjourney','APIMart']];
  const nav = (n, c, st, icon) => `<div class="n ${st||''}">${icon?I(icon):''}${n}<i class="num">${c}</i></div>`;
  return `<div class="ovl mp" style="left:144px;bottom:66px">
    <div class="top"><div class="search">${I('search')}搜索模型，拼音也行</div><div class="seg"><span class="cur">全部</span><span>图片</span><span>视频</span><span>音频</span><span>其他</span></div></div>
    <div class="body"><div class="nav">${nav('全部',158,'cur','layout-grid')}${nav('收藏',0,'','star')}<div class="h">供应商</div>${nav('KIE',40)}${nav('APIMart',34)}${nav('百炼',8)}${nav('火山引擎',8)}${nav('魔搭',7)}${nav('Fal',51)}${nav('Grsai',8)}</div>
      <div class="list"><div class="h">图片 <span class="num" style="margin-left:6px;color:var(--icon-rest)">72</span></div><div class="grid">${rows.map(r=>m(...r)).join('')}</div></div></div></div>`;
}
function ctxMenu(x, y, toLeft){ return `<div class="ovl menu" style="left:${x}px;top:${y}px"><div class="mi2">${I('clipboard')}粘贴<span class="k num">Ctrl+V</span></div><div class="ms"></div><div class="mi2 hov">${I(toLeft?'panel-left':'panel-bottom')}${toLeft?'把输入面板放到左侧':'把输入面板放到底部'}</div></div>`; }
function app(o){
  if (o.left) return `<div class="app shot">${titlebar()}<div class="gen left-mode">${leftPanel(o)}<div class="main">${filters()}${feed({short:1})}</div></div></div>`;
  return `<div class="app shot">${titlebar()}<div class="gen"><div class="main">${filters()}${feed(o)}<div class="dock-space" style="height:${o.refs?226:154}px"></div>${composer(o)}${o.model?modelPanel(o):''}${o.menu?ctxMenu(o.menu[0],o.menu[1],true):''}</div></div></div>`;
}
function sheet(){
  const z = (html, w) => `<div class="z"><div style="width:${w||430}px;position:relative">${html}</div></div>`;
  return `<div class="sheet shot" style="height:auto">
    <div class="ex"><h3>错误提示 · 现状</h3><p>“生成任务失败”加供应商原话，只有“问助手”，没有“重试”。</p>
      <div class="crop" style="height:150px;background-image:url('现状/05-失败记录.png');background-size:1440px auto;background-position:-150px -560px"></div></div>
    <div class="ex"><h3>错误提示 · 草稿</h3><p>一条淡红底的提示，图标是红的。标题说发生了什么，后面一句说能做什么；“重试”排第一，供应商原话收进“详情”，“问助手”保留。</p>
      ${z(`<div class="fail"><span class="fi">${I('triangle-alert')}</span><span class="ft">没生成出来</span><span class="fm">请求太频繁，过一会儿再试</span><div class="fa"><span class="btn sm secondary">重试</span><span class="btn sm">详情</span><span class="btn sm">问助手</span></div></div>`, 520)}</div>
    <div class="ex"><h3>切换位置：在输入面板上右键</h3><p>不占界面上的位置。面板上右键，菜单里除了原来的“粘贴”，多一项“把输入面板放到左侧”（在左侧时是“放到底部”）。写到一半的提示词、参考素材、参数原样带过去，下次打开记住上次的位置。</p>
      ${z(`<div style="height:120px"></div>${ctxMenu(40,8,true)}`, 300)}</div>
    <div class="ex"><h3>生成中</h3><p>占位格和成品同样大小，落地后原地换成图，列表不跳。进度是一根细线加百分比。</p>
      ${z(`<div class="results"><div class="res pending" style="width:140px;height:140px"><span class="num">62%</span><div class="bar" style="width:84px"><i style="width:62%"></i></div></div><div class="res pending" style="width:140px;height:140px"><span>排队中</span><div class="bar" style="width:84px"><i style="width:0"></i></div></div></div>`, 300)}</div>
  </div>`;
}

const SCREENS = [
  { id:1, title:'① 输入面板在底部', before:'现状/01-底部输入.png',
    note:'历史记录的结构不动：参考素材叠在左上、提示词最多两行、下面一行模型和时间、结果在下。只做了统一风格的小收拾：提示词不再用粗体、操作图标平时退到暗灰、输入面板参数条里的参数名退一档。错误提示换成新样子。',
    html: () => app({}) },
  { id:2, title:'② 输入面板在左侧', before:'现状/02-向上滚动.png',

  { id:3, title:'③ 模型面板与右键菜单', before:'现状/03-模型面板.png',
    note:'模型面板样子不变（仍是一格一格、当前模型蓝色），只改位置：左缘对齐输入面板，贴着模型按钮上方弹出。右下是输入面板的右键菜单。',
    html: () => app({ model:1, menu:[980,668] }) },
  { id:4, title:'④ 细节：错误提示、切换位置、生成中', before:null, note:'', html: sheet },

const page = document.getElementById('page');
SCREENS.forEach(s => {

  el.innerHTML = `<h2>${s.title}</h2><p class="note">${s.note}</p><div class="pair">`

    + `<div class="side"><div class="tag"><b>草稿</b></div>${s.html()}</div></div>`;
  page.appendChild(el);

const q = new URLSearchParams(location.search);
if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
else { const fit = () => document.querySelectorAll('.pair').forEach(p => { p.style.zoom = Math.min(1, (innerWidth - 80) / p.scrollWidth); }); fit(); addEventListener('resize', fit); }
