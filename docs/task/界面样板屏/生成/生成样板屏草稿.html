<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成样板屏草稿</title>
<style>
@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 数值取自 src/index.css 的石墨主题令牌；--icon-rest 是剪辑样板屏新增的静息图标灰 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --text-disabled:#4E4E4E; --icon-rest:#737373;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE; --on-accent:#FFFFFF;
  --danger-solid:#D73E3F; --danger-text:#FB817A; --warning-text:#F5AE39;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; font-synthesis:style; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }

/* 页面外框（不属于软件界面） */
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:cover; object-position:0 0; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; zoom:1 !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* 软件界面 */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--window); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.ib.rest { color:var(--icon-rest); }
.ib.on { color:var(--accent-text); }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:12px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn.secondary { background:var(--control); color:var(--text1); }
.btn.sm { height:24px; padding:0 8px; }
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.titlebar .wc svg { stroke-width:1.5; }

/* 生成工作区：筛选行、记录、输入区同一左右缘；输入区有底部、左侧两种形态 */
.gen { flex:1; min-height:0; display:flex; position:relative; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; position:relative; }
.col { width:960px; }
.left-mode .col { width:auto; align-self:stretch; margin:0 32px; }
.filters { height:44px; flex:none; display:flex; align-items:center; gap:2px; border-bottom:1px solid var(--line); }
.filters .f { height:28px; padding:0 10px; display:flex; align-items:center; border-radius:6px; font-size:12px; color:var(--text3); font-weight:var(--w-medium); }
.filters .f.cur { background:var(--selected); color:var(--text1); }
.filters .r { margin-left:auto; display:flex; gap:2px; align-items:center; }
.feed { flex:1; min-height:0; overflow:hidden; }
.dock-space { flex:none; }
/* 一条记录：左边是输入（提示词、参考素材、模型与时间），右边是结果 */
.rec { display:grid; grid-template-columns:300px minmax(0,1fr); column-gap:24px; padding:16px 0; border-bottom:1px solid var(--line); }
.rec:last-child { border-bottom:0; }
.rin { display:flex; flex-direction:column; min-width:0; min-height:132px; }
.rin .p { font-size:13px; line-height:20px; color:var(--text1); white-space:normal; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.rin .p.none { color:var(--icon-rest); }
.rin .refs { display:flex; gap:4px; margin-top:8px; align-items:center; }
.rin .refs .t { width:32px; height:32px; border-radius:4px; background:var(--raised) center/cover; position:relative; flex:none; }
.rin .refs .t b { position:absolute; left:2px; top:2px; min-width:12px; height:12px; border-radius:3px; background:rgba(0,0,0,.65); color:#fff; font-size:9px; line-height:12px; text-align:center; font-weight:var(--w-normal); }
.rin .refs .more { font-size:11px; color:var(--text3); margin-left:4px; }
.rin .m { font-size:11px; line-height:16px; color:var(--text3); margin-top:8px; }
.rin .acts { margin-top:auto; padding-top:6px; display:flex; gap:2px; margin-left:-5px; }
.results { display:flex; gap:6px; flex-wrap:wrap; align-content:flex-start; }
.res { height:132px; border-radius:6px; background:var(--media) center/cover; position:relative; overflow:hidden; flex:none; }
.big .res { height:176px; }
.res .chip { position:absolute; right:6px; bottom:6px; height:18px; padding:0 6px; border-radius:4px; background:rgba(0,0,0,.6); color:#fff; font-size:10px; line-height:18px; }
.res .play { position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; --s:16px; }
.res .hover-acts { position:absolute; right:6px; top:6px; display:flex; gap:2px; padding:2px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; }
.res .hover-acts .ib { color:#fff; width:24px; height:24px; --s:14px; }
.res.pending { background:var(--raised); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px; color:var(--text3); font-size:11px; }
.res.pending .bar { width:80px; height:2px; border-radius:1px; background:var(--line-strong); position:relative; overflow:hidden; }
.res.pending .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--text2); }
.audio { height:40px; width:440px; border-radius:6px; background:var(--raised); display:flex; align-items:center; gap:10px; padding:0 12px 0 6px; color:var(--text2); font-size:11px; }
.audio svg.w { flex:1; height:22px; color:var(--icon-rest); }
.fail { display:flex; align-items:center; gap:10px; height:40px; padding:0 8px 0 12px; border-radius:6px; background:rgba(215,62,63,.12); width:max-content; max-width:100%; }
.fail .fi { color:var(--danger-text); --s:16px; }
.fail .ft { font-size:13px; color:var(--text1); font-weight:var(--w-medium); }
.fail .fm { font-size:12px; color:var(--text2); }
.fail .fa { display:flex; gap:4px; margin-left:12px; }

/* 输入区 · 底部形态 */
.composer { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; width:960px; background:var(--panel); border:1px solid var(--line-strong); border-radius:12px; padding:12px 12px 8px; }
.refs { display:flex; gap:6px; margin-bottom:10px; }
.ref { width:48px; height:48px; border-radius:6px; background:var(--raised) center/cover; position:relative; display:flex; align-items:center; justify-content:center; color:var(--icon-rest); flex:none; }
.ref b { position:absolute; left:3px; top:3px; min-width:14px; height:14px; border-radius:4px; background:rgba(0,0,0,.65); color:#fff; font-size:10px; line-height:14px; text-align:center; font-weight:var(--w-normal); }
.prompt { font-size:14px; line-height:22px; color:var(--text1); min-height:44px; white-space:normal; padding:0 4px; }
.prompt.ph { color:var(--icon-rest); }
.pbar { display:flex; align-items:center; gap:2px; height:32px; margin-top:6px; }
.pbar .model, .lp .model { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); --s:12px; }
.model small { font-size:11px; color:var(--text3); font-weight:var(--w-normal); }
.model svg { color:var(--icon-rest); }
.model.open { background:var(--selected); }
.pbar .param { height:28px; padding:0 8px; display:flex; align-items:center; gap:6px; border-radius:6px; font-size:12px; color:var(--text2); --s:12px; }
.pbar .param label { color:var(--text3); }
.pbar .param svg { color:var(--icon-rest); }
.pbar .sp { width:1px; height:14px; background:var(--line-strong); margin:0 6px; }
.pbar .right { margin-left:auto; display:flex; align-items:center; gap:2px; }
.price { font-size:12px; color:var(--text3); }
.send { width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; margin-left:6px; --s:16px; flex:none; }

/* 输入区 · 左侧形态：一块竖着排的面板，从上到下是模型、参考素材、提示词、参数，底部固定“生成” */
.lp { width:344px; flex:none; background:var(--panel); border-right:2px solid var(--gap); display:flex; flex-direction:column; min-height:0; }
.lp .head { height:44px; flex:none; display:flex; align-items:center; padding:0 8px 0 6px; border-bottom:1px solid var(--line); }
.lp .head .model { font-size:13px; }
.lp .head .r { margin-left:auto; display:flex; gap:2px; }
.lp .body { flex:1; min-height:0; overflow:hidden; padding:12px 12px 0; display:flex; flex-direction:column; gap:14px; }
.lp .lab { font-size:12px; font-weight:var(--w-semibold); color:var(--text2); height:20px; display:flex; align-items:center; margin-bottom:6px; }
.lp .lab span { margin-left:auto; font-weight:var(--w-normal); font-size:11px; color:var(--icon-rest); }
.lp .refs { margin:0; flex-wrap:wrap; }
.lp .ref { width:72px; height:72px; }
.lp .ptext { border-radius:8px; background:var(--raised); padding:8px 10px; font-size:13px; line-height:20px; height:148px; color:var(--text1); white-space:normal; position:relative; }
.lp .ptext .tools { position:absolute; right:4px; bottom:4px; display:flex; gap:2px; }
.lp .row { height:32px; display:flex; align-items:center; font-size:12px; }
.lp .row .nm { width:88px; flex:none; color:var(--text3); }
.lp .fld { height:28px; flex:1; min-width:0; border-radius:6px; background:var(--raised); display:flex; align-items:center; padding:0 8px; font-size:12px; color:var(--text1); --s:12px; }
.lp .fld svg { margin-left:auto; color:var(--icon-rest); }
.lp .seg { height:28px; flex:1; border-radius:6px; background:var(--raised); display:flex; padding:2px; gap:2px; font-size:12px; color:var(--text3); }
.lp .seg span { flex:1; display:flex; align-items:center; justify-content:center; border-radius:4px; }
.lp .seg span.cur { background:var(--line-overlay); color:var(--text1); font-weight:var(--w-medium); }
.lp .cb { width:16px; height:16px; border-radius:4px; border:1px solid #4a4a4a; display:flex; align-items:center; justify-content:center; --s:11px; color:var(--text1); }
.lp .cb svg { stroke-width:2.5; }
.lp .disc { height:28px; display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text3); --s:12px; }
.lp .foot { flex:none; border-top:1px solid var(--line); padding:12px; display:flex; align-items:center; gap:12px; }
.lp .go { height:36px; flex:1; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; font-size:14px; font-weight:var(--w-medium); --s:16px; }

/* 模型面板（浮层：实底加一圈描边，不用投影） */
.ovl { position:absolute; background:var(--overlay); border:1px solid var(--line-overlay); z-index:20; }
.mp { border-radius:12px; width:720px; height:404px; display:flex; flex-direction:column; overflow:hidden; }
.mp .top { height:44px; flex:none; display:flex; align-items:center; gap:8px; padding:0 8px; border-bottom:1px solid var(--line-overlay); }
.mp .search { flex:1; height:28px; border-radius:8px; background:#303030; display:flex; align-items:center; gap:6px; padding:0 8px; color:var(--text3); font-size:12px; --s:14px; }
.mp .seg { display:flex; gap:2px; font-size:12px; color:var(--text3); }
.mp .seg span { height:24px; padding:0 8px; display:flex; align-items:center; border-radius:6px; }
.mp .seg span.cur { background:#3a3a3a; color:var(--text1); font-weight:var(--w-medium); }
.mp .body { flex:1; min-height:0; display:flex; }
.mp .nav { width:148px; flex:none; border-right:1px solid var(--line-overlay); padding:6px 4px; }
.mp .nav .n { height:28px; display:flex; align-items:center; padding:0 8px; border-radius:6px; font-size:12px; color:var(--text2); gap:6px; --s:14px; }
.mp .nav .n.cur { background:#3a3a3a; color:var(--text1); }
.mp .nav .n i { margin-left:auto; font-style:normal; font-size:11px; color:var(--icon-rest); }
.mp .nav .h { height:24px; display:flex; align-items:center; padding:0 8px; font-size:11px; color:var(--icon-rest); margin-top:6px; }
.mp .list { flex:1; min-width:0; padding:6px 6px 0; overflow:hidden; }
.mp .list .h { height:24px; display:flex; align-items:center; padding:0 8px; font-size:11px; color:var(--text3); }
.mp .grid { display:grid; grid-template-columns:1fr 1fr 1fr; column-gap:4px; }
.mp .mi { height:28px; display:flex; align-items:center; padding:0 8px; border-radius:6px; font-size:12px; color:var(--text1); gap:6px; min-width:0; --s:12px; }
.mp .mi span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.mp .mi small { margin-left:auto; font-size:11px; color:var(--icon-rest); flex:none; }
.mp .mi.cur { background:#3a3a3a; }
.mp .mi.cur svg { color:var(--accent-text); flex:none; }
.mp .mi.hov { background:#323232; }

/* 空状态 */
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text3); font-size:13px; padding-bottom:170px; }
.empty .ei { color:var(--icon-rest); --s:28px; margin-bottom:6px; }
.empty .ei svg { stroke-width:1.5; }

/* 细节放大图 */
.sheet { width:1440px; background:var(--window); padding:28px 32px; display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; align-content:start; white-space:nowrap; }
.ex h3 { margin:0 0 2px; font-size:13px; line-height:20px; font-weight:var(--w-medium); color:var(--text1); }
.ex p { margin:0 0 10px; font-size:12px; line-height:18px; color:var(--text3); white-space:normal; }
.ex .z { zoom:1.5; }
.crop { width:660px; background-repeat:no-repeat; border-radius:4px; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>生成工作区 · 样板屏设计草稿</h1>
  <p class="lead">照剪辑样板屏定下的规律画：内容最亮，名字退后，蓝色只给“生成”这一个主动作。左边是现在的真实截图，右边是草稿，静态画面不能点。</p>
</div>

    note:'输入区变成左边一块竖排的面板：模型、参考素材、提示词、参数从上到下，底部固定一个“生成”按钮。右边的历史更宽，结果图放大到 176 高。写长提示词、挂多张参考图、参数多的模型更适合这个形态。',
    html: () => app({ left:1 }) },
  { id:3, title:'③ 底部形态：带参考图、模型面板打开', before:'现状/03-模型面板.png',
    note:'模型面板和输入区左缘对齐，从模型名上方展开。模型是一行一行的列表；当前模型用中性底加一个勾，不用整格蓝色。',
    html: () => app({ refs:1, prompt:1, model:1 }) },
  { id:4, title:'④ 空状态', before:'现状/04-空状态.png', note:'', html: () => app({ empty:1 }) },
  { id:5, title:'⑤ 细节', before:null, note:'', html: sheet },
];
const page = document.getElementById('page');
SCREENS.forEach(s => {
  const el = document.createElement('section'); el.className = 'block'; el.dataset.id = s.id;
  el.innerHTML = `<h2>${s.title}</h2><p class="note">${s.note}</p><div class="pair">`
    + (s.before ? `<div class="side before-side"><div class="tag"><b>现状</b>（真实截图）</div><img class="shot before" src="${s.before}"></div>` : '')
    + `<div class="side"><div class="tag"><b>草稿</b></div>${s.html()}</div></div>`;
  page.appendChild(el);
});
const q = new URLSearchParams(location.search);
if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
else { const fit = () => document.querySelectorAll('.pair').forEach(p => { p.style.zoom = Math.min(1, (innerWidth - 80) / p.scrollWidth); }); fit(); addEventListener('resize', fit); }
</script>
