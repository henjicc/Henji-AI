<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>画布样板屏草稿</title>
<style>
@font-face { font-family: 'HarmonyOS Sans SC UI'; src: url('../../../../src/assets/fonts/HarmonyOS_Sans_SC.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
:root {
  /* 数值取自 src/index.css 的石墨主题令牌 */
  --gap:#181818; --window:#1B1B1B; --panel:#212121; --raised:#272727; --overlay:#292929;
  --line-overlay:#393939; --control:#2B2B2B; --hover:#2A2A2A; --selected:#333333;
  --line:#282828; --line-strong:#313131; --media:#191919; --canvas:#161616;
  --text1:#EEEEEE; --text2:#CACACA; --text3:#A5A5A5; --icon-rest:#737373;
  --accent:#3A6FDF; --accent-text:#9CBEFF; --accent-ring:#6A9BFE;
  --danger-solid:#D73E3F; --danger-text:#FB817A; --warning-text:#F5AE39;
  --w-normal:400; --w-medium:460; --w-semibold:580;
}
* { box-sizing: border-box; }
html, body { margin:0; background:#101010; color:var(--text1); font-family:'HarmonyOS Sans SC UI','Microsoft YaHei UI',sans-serif; font-size:13px; line-height:20px; font-weight:var(--w-normal); -webkit-font-smoothing:antialiased; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width:var(--s,16px); height:var(--s,16px); flex:none; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; display:block; }
.page { padding:40px 40px 80px; }
.page h1 { font-size:20px; line-height:28px; font-weight:560; margin:0 0 6px; }
.page .lead { color:var(--text3); margin:0 0 36px; max-width:900px; }
.block { margin-bottom:72px; }
.block h2 { font-size:16px; line-height:24px; font-weight:var(--w-semibold); margin:0 0 4px; }
.block .note { color:var(--text3); font-size:12px; line-height:18px; margin:0 0 16px; max-width:1100px; white-space:pre-line; }
.pair { display:flex; gap:40px; align-items:flex-start; }
.side { flex:none; }
.side .tag { font-size:12px; color:var(--text3); margin-bottom:8px; }
.side .tag b { color:var(--text1); font-weight:var(--w-medium); }
.shot { width:1440px; height:900px; display:block; }
.shot.before { object-fit:cover; object-position:0 0; }
body.single { background:var(--gap); }
body.single .page { padding:0; }
body.single .page > h1, body.single .lead, body.single .block { display:none; }
body.single .block.show { display:block; margin:0; }
body.single .block.show h2, body.single .block.show .note, body.single .tag { display:none; }
body.single.draft .side.before-side { display:none; }
body.single .pair { gap:24px; zoom:1 !important; }
body.single.pairmode { background:#101010; }
body.single.pairmode .page { padding:24px; }
body.single.pairmode .tag { display:block; font-size:20px; line-height:28px; margin-bottom:12px; }

/* 软件界面通用零件 */
.app { width:1440px; height:900px; position:relative; overflow:hidden; background:var(--window); display:flex; flex-direction:column; font-size:13px; color:var(--text1); white-space:nowrap; }
.ib { width:28px; height:28px; flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text2); }
.ib.rest { color:var(--icon-rest); }
.ib.s24 { width:24px; height:24px; --s:14px; }
.btn { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:13px; font-weight:var(--w-medium); color:var(--text2); --s:14px; flex:none; }
.btn.secondary { background:var(--control); color:var(--text1); }
.btn.primary { background:var(--accent); color:#fff; height:32px; padding:0 14px; }
.btn.primary svg { color:#fff; }
.titlebar { height:40px; flex:none; background:var(--window); display:flex; align-items:center; padding:0 0 0 14px; position:relative; }
.titlebar .brand { font-size:13px; font-weight:var(--w-semibold); margin-right:14px; }
.titlebar .menu { display:flex; gap:2px; }
.titlebar .menu span { font-size:12px; color:var(--text3); padding:0 7px; height:24px; display:flex; align-items:center; }
.titlebar .nav { position:absolute; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
.titlebar .nav span { height:28px; padding:0 12px; display:flex; align-items:center; border-radius:6px; font-size:13px; color:var(--text2); font-weight:var(--w-medium); }
.titlebar .nav span.cur { background:var(--selected); color:var(--text1); }
.titlebar .right { margin-left:auto; display:flex; align-items:center; height:100%; }
.titlebar .wc { width:44px; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text3); --s:14px; }
.ovl { position:absolute; background:var(--overlay); border:1px solid var(--line-overlay); z-index:20; }

/* ① 文档列表页（画布、音频编辑、镜头参考、图片编辑共用） */
.lib { flex:1; min-height:0; display:flex; }
.rail { width:224px; flex:none; border-right:1px solid var(--line); padding:12px 8px; display:flex; flex-direction:column; gap:2px; }
.nv { height:32px; display:flex; align-items:center; gap:10px; padding:0 10px; border-radius:6px; color:var(--text2); font-size:13px; }
.nv svg { color:var(--icon-rest); }
.nv.cur { background:var(--selected); color:var(--text1); }
.nv.cur svg { color:var(--text2); }
.nv i { margin-left:auto; font-style:normal; font-size:12px; color:var(--text3); }
.nv i.warn { color:var(--warning-text); }
.rail .h { height:28px; display:flex; align-items:center; padding:0 10px; margin-top:12px; font-size:12px; color:var(--text3); }
.lmain { flex:1; min-width:0; padding:0 32px; display:flex; flex-direction:column; }
.lhead { height:64px; flex:none; display:flex; align-items:center; gap:8px; }
.lhead .title { font-size:20px; line-height:28px; font-weight:var(--w-semibold); }
.lhead .count { font-size:13px; color:var(--text3); margin-left:8px; }
.lhead .grow { flex:1; }
.search { width:240px; height:32px; border-radius:8px; background:var(--raised); display:flex; align-items:center; gap:8px; padding:0 10px; color:var(--icon-rest); font-size:13px; --s:14px; }
.dd { height:32px; padding:0 8px 0 10px; display:flex; align-items:center; gap:6px; border-radius:6px; color:var(--text2); --s:14px; }
.dd svg { color:var(--icon-rest); }
.segi { display:flex; gap:2px; padding:2px; border-radius:8px; background:var(--gap); }
.segi span { width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--icon-rest); }
.segi span.cur { background:var(--selected); color:var(--text1); }
.cards { display:grid; grid-template-columns:repeat(4, 1fr); gap:28px 16px; padding-top:8px; }
.card .cv { aspect-ratio:16/10; border-radius:8px; background:var(--raised) center/cover; position:relative; display:flex; align-items:center; justify-content:center; color:var(--icon-rest); --s:28px; }
.card .cv svg { stroke-width:1.5; }
.card .t { margin-top:10px; font-size:13px; font-weight:var(--w-medium); color:var(--text1); overflow:hidden; text-overflow:ellipsis; }
.card .m { margin-top:2px; font-size:12px; color:var(--text3); }
.card .m .warn { color:var(--warning-text); }
.card.hov .cv { box-shadow:0 0 0 1px var(--line-overlay); }
.card .cv .acts { position:absolute; right:8px; top:8px; display:flex; gap:4px; }
.card .cv .acts span { width:28px; height:28px; border-radius:6px; background:rgba(24,24,24,.72); color:#e8e8e8; display:flex; align-items:center; justify-content:center; --s:14px; }

/* ② 画布编辑器 */
.cvs { flex:1; min-height:0; position:relative; background:var(--canvas); background-image:radial-gradient(circle, #2a2a2a 1px, transparent 1.2px); background-size:20px 20px; overflow:hidden; }
.back { position:absolute; left:12px; top:12px; height:36px; display:flex; align-items:center; gap:2px; padding:0 10px 0 4px; border-radius:10px; background:rgba(33,33,33,.92); border:1px solid var(--line-overlay); z-index:10; }
.back .nm { font-size:13px; font-weight:var(--w-medium); color:var(--text1); margin-left:2px; }
.back .sv { font-size:12px; color:var(--text3); margin-left:10px; }
.zoom { position:absolute; right:12px; top:12px; height:36px; display:flex; align-items:center; gap:2px; padding:0 4px; border-radius:10px; background:rgba(33,33,33,.92); border:1px solid var(--line-overlay); z-index:10; font-size:12px; color:var(--text2); }
.zoom .p { min-width:44px; text-align:center; }
.mini { position:absolute; right:12px; bottom:12px; width:176px; height:112px; border-radius:8px; background:rgba(33,33,33,.92); border:1px solid var(--line-overlay); z-index:10; overflow:hidden; }
.mini b { position:absolute; background:#4a4a4a; border-radius:2px; }
.mini .vp { position:absolute; border:1px solid var(--text3); border-radius:2px; }
.node { position:absolute; }
.node .nh { height:24px; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text3); --s:14px; padding:0 2px; }
.node .nh svg { color:var(--icon-rest); }
.node .nh .pr { margin-left:auto; font-size:12px; color:var(--text3); }
.node .nb { border-radius:12px; background:var(--panel); border:1px solid var(--line-strong); overflow:hidden; position:relative; }
.node.sel .nb { box-shadow:0 0 0 1.5px var(--accent-ring); border-color:transparent; }
.node .media { background:var(--media) center/cover; position:relative; }
.node .dur { position:absolute; right:8px; bottom:8px; height:20px; padding:0 6px; border-radius:4px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:20px; }
.node .ply { position:absolute; left:10px; bottom:8px; color:#fff; --s:16px; }
.node .prm { padding:10px 12px; font-size:13px; line-height:21px; color:var(--text1); white-space:normal; height:148px; overflow:hidden; border-bottom:1px solid var(--line); }
.chip { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px 0 2px; border-radius:6px; background:var(--raised); border:1px solid var(--line-strong); font-size:12px; color:var(--text2); vertical-align:1px; }
.chip i { width:16px; height:16px; border-radius:4px; background:center/cover; }
.rows { padding:4px 0; }
.row { height:32px; display:flex; align-items:center; padding:0 12px; font-size:12px; color:var(--text3); position:relative; --s:12px; }
.row .v { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text2); }
.row .v small { color:var(--text3); font-size:12px; }
.row .v svg { color:var(--icon-rest); }
.row .th { width:22px; height:22px; border-radius:4px; background:center/cover; }
.port { position:absolute; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--panel); }
.port.img { background:#7FB6FF; } .port.vid { background:#FF8A7A; }
.edges { position:absolute; inset:0; pointer-events:none; }
.edges path { fill:none; stroke:#5a5a5a; stroke-width:1.5; }
.tb { position:absolute; height:40px; display:flex; align-items:center; gap:2px; padding:0 4px; border-radius:10px; background:rgba(33,33,33,.95); border:1px solid var(--line-overlay); z-index:12; }
.tb .btn { height:30px; }
.tb .btn svg { color:var(--text3); }
.tb .sep { width:1px; height:18px; background:var(--line-overlay); margin:0 4px; }
.tb .btn.primary { height:30px; }
/* 素材找不到 */
.fault { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--text1); font-size:12px;
  background:repeating-linear-gradient(135deg, rgba(215,62,63,.16) 0 6px, rgba(215,62,63,.07) 6px 12px); }
.fault .fi { color:var(--danger-text); --s:18px; }
.fault .fm { color:var(--text2); font-size:11px; }
/* 右键菜单 */
.menu { border-radius:8px; padding:4px; width:216px; font-size:13px; }
.menu .gh { height:24px; display:flex; align-items:center; padding:0 10px; font-size:11px; color:var(--text3); }
.menu .mi { height:28px; display:flex; align-items:center; padding:0 10px; border-radius:6px; gap:8px; color:var(--text1); --s:14px; }
.menu .mi svg { color:var(--text3); }
.menu .mi.hov { background:#353535; }
.menu .ms { height:1px; background:var(--line-overlay); margin:4px 6px; }
.menu .sr { height:32px; margin:0 0 4px; border-radius:6px; background:#303030; display:flex; align-items:center; gap:6px; padding:0 8px; color:var(--icon-rest); font-size:12px; --s:14px; }
/* 细节放大 */
.sheet { width:1440px; background:var(--window); padding:28px 32px; display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; align-content:start; white-space:nowrap; }
.ex h3 { margin:0 0 2px; font-size:13px; line-height:20px; font-weight:var(--w-medium); color:var(--text1); }
.ex p { margin:0 0 10px; font-size:12px; line-height:18px; color:var(--text3); white-space:normal; }
.ex .stage { position:relative; background:var(--canvas); background-image:radial-gradient(circle, #2a2a2a 1px, transparent 1.2px); background-size:20px 20px; border-radius:8px; overflow:hidden; }
.crop { width:620px; background-repeat:no-repeat; border-radius:6px; }
</style>
</head>
<body>
<div class="page" id="page">
  <h1>画布 · 样板屏设计草稿</h1>
  <p class="lead">按剪辑样板屏的规律收拾：内容最亮，名字退后，默认值再退后；强调色只给“新建”这个主动作、选中节点的描边和焦点。文档列表页是画布、音频编辑、镜头参考、图片编辑共用的一页，这里画一次，其他几处照同一页改。</p>
</div>

/* ① 列表页：真实数据（2026-11-11 的资料目录，4 个画布都不在项目里，所以“项目”一组不出现） */
function library(o){
  const nv = (icon, label, count, cls, warn) => `<div class="nv ${cls||''}">${I(icon)}${label}${count!=null?`<i class="num ${warn?'warn':''}">${count}</i>`:''}</div>`;
  const card = (c) => `<div class="card ${c.hov?'hov':''}"><div class="cv" style="${c.img?`background-image:url('素材/${c.img}')`:''}">${c.img?'':I('layout-grid')}${c.hov?`<div class="acts"><span>${I('folder-open')}</span><span>${I('ellipsis')}</span></div>`:''}</div>
    <div class="t">${c.t}</div><div class="m num">${c.draft?'<span class="warn">未保存</span> · ':''}${c.m}</div></div>`;
  return `<div class="app shot">${titlebar(['文件','视图','窗口','帮助'])}<div class="lib">
    <div class="rail">${nv('layers','全部',4,'cur')}${nv('clock','最近打开')}${nv('file-pen','未保存草稿',1,'',true)}</div>
    <div class="lmain">
      <div class="lhead"><span class="title">画布</span><span class="count num">4</span><span class="grow"></span>
        <div class="search">${I('search')}搜索画布</div>
        <div class="dd">最近修改${I('chevron-down')}</div>
        <div class="segi"><span class="cur">${I('layout-grid')}</span><span>${I('list')}</span></div>
        <span style="width:8px"></span>${ib('ellipsis','rest')}
        <span class="btn primary">${I('plus')}新建画布</span></div>
      <div class="cards">
        ${card({img:'草稿-封面.jpg', t:'未命名画布 1', m:'1 个节点 · 10月25日', draft:1})}
        ${card({img:'樱花-人像.jpg', t:'樱花仰拍参考图', m:'10 个节点 · 11月10日', hov:o.hov})}
        ${card({img:'城市夜景-封面.jpg', t:'城市夜景仰拍人像', m:'4 个节点 · 11月9日'})}
        ${card({t:'局部修改测试-改日期', m:'1 个节点 · 10月31日'})}
      </div>
    </div></div></div>`;
}

function node(o){
  const head = `<div class="nh">${I(o.icon)}<span>${o.title}</span>${o.price?`<span class="pr num">${o.price}</span>`:''}</div>`;
  return `<div class="node ${o.sel?'sel':''}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px">${head}<div class="nb">${o.body}</div>${o.ports||''}</div>`;
}

    note:'左上角的“返回画布列表”换成返回箭头 + 画布名 + 保存状态（与剪辑、图片编辑的命令带左端同一组信息）；右上角补一个缩放条（缩小、比例、放大、适应画布）。\n节点：标题与价格退到第三档文字，图标灰；参数名第三档、值第二档、箭头图标灰；提示词是内容，最亮。选中只靠一圈强调色描边。\n工具条：特有的事（局部重绘、高清放大、打光、720° 全景、加入剪辑）留文字，通用动作（编辑、复制、收进资产、下载、删除）只放图标灰；不再出现第二个蓝色按钮。\n小地图缩到 176×112，半透明实底加描边，不再盖住节点内容。',
    html: () => editor({ sel:1 }) },
  { id:4, title:'④ 画布：右键添加节点', before:'现状/03-右键菜单.png',
    note:'菜单顶上加“搜索节点”（节点种类已经二十多种，列表要滚动）；分组名第三档小字，菜单项 28 高，图标第三档。',
    html: () => editor({ menu:[300, 120] }) },
  { id:5, title:'⑤ 细节：素材找不到、打开时的视野', before:null, note:'', html: sheet },
];
const page = document.getElementById('page');
SCREENS.forEach(s => {
  const el = document.createElement('section'); el.className = 'block'; el.dataset.id = s.id;
  el.innerHTML = `<h2>${s.title}</h2><p class="note">${s.note}</p><div class="pair">`
    + (s.before ? `<div class="side before-side"><div class="tag"><b>现状</b>（真实截图）</div><img class="shot before" src="${s.before}"></div>` : '')
    + `<div class="side"><div class="tag"><b>草稿</b></div>${s.html()}</div></div>`;
  page.appendChild(el);
});
// 细节页里“打开画布 · 草稿”用缩小的整屏示意
document.querySelectorAll('.block[data-id="5"] .ex .stage').forEach((stage, i) => { if (i === 1) stage.outerHTML = `<div style="width:620px;height:388px;overflow:hidden;border-radius:6px"><div style="zoom:.43">${editor({})}</div></div>`; });
const q = new URLSearchParams(location.search);
if (q.get('s')) { document.body.classList.add('single', q.get('v')==='pair'?'pairmode':'draft'); document.querySelector(`.block[data-id="${q.get('s')}"]`).classList.add('show'); }
else { const fit = () => document.querySelectorAll('.pair').forEach(p => { p.style.zoom = Math.min(1, (innerWidth - 80) / p.scrollWidth); }); fit(); addEventListener('resize', fit); }
</script>
